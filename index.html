/* Спатифиллум: восковые листья, белое покрывало и медленное живое движение. */
.botanical-scene{position:relative;width:clamp(150px,28vw,205px);margin:-12px auto 14px;isolation:isolate}.botanic{display:block;width:100%;height:auto;position:relative;z-index:1;overflow:visible}.botanical-halo{position:absolute;inset:14% -10% 4%;border-radius:50%;background:radial-gradient(ellipse,#EBEBCF85,transparent 66%);z-index:0;animation:botanical-light 9s ease-in-out infinite alternate}.botanic-leaf{transform-box:fill-box;transform-origin:50% 100%;animation:leaf-breath 8s ease-in-out infinite alternate}.leaf-b{animation-delay:-3s;animation-duration:10s}.leaf-c{animation-delay:-5s;animation-duration:9s}.flower-sway{transform-box:fill-box;transform-origin:50% 100%;animation:flower-breath 7.5s ease-in-out infinite alternate}.flower-open{transform-box:fill-box;transform-origin:50% 100%;animation:flower-unfold 1.8s cubic-bezier(.2,.7,.25,1) both}.breath .eyebrow{flex-wrap:wrap;justify-content:center}.breath h2{font-size:clamp(28px,5vw,43px);line-height:1.2}
@keyframes leaf-breath{from{transform:rotate(-1.5deg)}to{transform:rotate(2deg)}}@keyframes flower-breath{from{transform:rotate(-1deg)}to{transform:rotate(1.8deg)}}@keyframes flower-unfold{from{opacity:.3;transform:scaleX(.36) rotate(8deg)}to{opacity:1;transform:scaleX(1) rotate(0)}}@keyframes botanical-light{from{opacity:.5;transform:scale(.96)}to{opacity:.85;transform:scale(1.04)}}
/* Цитата остаётся контрастной; свет проходит позади текста. */
.frankl-quote{position:relative;isolation:isolate;margin:28px 0 0;padding:clamp(24px,4vw,42px);overflow:hidden}.frankl-quote blockquote{position:relative;margin:0;max-width:780px}.frankl-quote blockquote p{font-family:'Onest',Arial,sans-serif;font-size:clamp(23px,3.4vw,35px);line-height:1.48;letter-spacing:-.025em;color:var(--emerald);margin:0;text-wrap:pretty}.quote-emphasis{position:relative}.quote-emphasis:before{content:'';position:absolute;inset:18% -4% -5%;border-radius:50%;background:#D8E86B50;filter:blur(14px);z-index:-1;animation:quote-breathe 8s ease-in-out infinite alternate}.quote-light{position:absolute;inset:-30% -50%;z-index:-1;background:linear-gradient(115deg,transparent 35%,#E2E9AA40 48%,#FFFFFF70 52%,transparent 65%);animation:quote-light 14s cubic-bezier(.4,0,.6,1) infinite}.frankl-quote figcaption{position:relative;font-size:12px;letter-spacing:.09em;color:var(--forest);margin-top:20px}.quote-caption{font-size:12px;color:var(--muted);margin:8px 0 0}.paused .botanic *,.paused .botanical-halo,.paused .quote-light,.paused .quote-emphasis:before{animation-play-state:paused!important}@keyframes quote-breathe{from{opacity:.35;transform:scaleX(.94)}to{opacity:.8;transform:scaleX(1.05)}}@keyframes quote-light{0%,12%{opacity:0;transform:translate3d(-25%,0,0)}35%{opacity:.8}65%{opacity:.6}88%,100%{opacity:0;transform:translate3d(25%,0,0)}}
/* Шесть показателей на общей диаграмме; длина нормирована по диапазону каждой шкалы. */
.score-comparison{padding:clamp(22px,4vw,34px);margin:0 0 24px}.score-comparison h3,.attention-section>h3,.doctor-summary h3{font-size:clamp(19px,3.7vw,25px);font-weight:500;line-height:1.35}.comparison-note{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 23px;max-width:690px}.comparison-list{list-style:none;display:grid;gap:22px;padding:0;margin:0}.comparison-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:13px;color:var(--emerald)}.comparison-heading>span{min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.comparison-heading strong{font-weight:600}.comparison-heading small{font-size:11px;color:var(--muted)}.comparison-heading b{white-space:nowrap;font-size:19px;letter-spacing:-.03em}.comparison-heading b small{font-weight:400;font-size:12px}.comparison-rail{position:relative;height:9px;border-radius:8px;background:#1F6B4A12;margin-top:10px;isolation:isolate}.comparison-fill{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#1C684A,#5C9B6D);transform:scaleX(var(--score));transform-origin:left;animation:comparison-grow 1.5s var(--ease-out) both}.comparison-row.warm .comparison-fill{background:linear-gradient(90deg,#99814D,#BEA66C)}.comparison-threshold{position:absolute;top:-4px;bottom:-4px;border-left:1px solid #446344;z-index:1}.comparison-range{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}.comparison-range span:nth-child(2){text-align:center}.comparison-legend{font-size:11px;color:var(--muted);margin:23px 0 0}.comparison-legend span{font-size:17px;color:var(--forest)}@keyframes comparison-grow{from{transform:scaleX(0)}to{transform:scaleX(var(--score))}}
/* Врачебная сводка — отдельный экран, без передачи ответов в URL. */
.doctor-entry{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px;margin:24px 0;text-decoration:none;color:var(--emerald)}.doctor-entry div{min-width:0}.doctor-entry strong{display:block;font-size:18px;font-weight:500;line-height:1.4}.doctor-entry small{display:block;font-size:12px;line-height:1.65;color:var(--muted);margin-top:6px}.doctor-entry>svg{flex:none;width:23px;height:23px}.doctor-entry:focus-visible{outline:3px solid var(--forest);outline-offset:5px}.doctor-heading{display:grid;grid-template-columns:minmax(0,1fr) 170px;align-items:center;gap:20px}.doctor-heading h2{font-size:clamp(32px,5vw,46px);line-height:1.17}.doctor-heading .eyebrow{font-size:10px}.doctor-heading .profile-summary{font-size:12px;color:var(--muted);margin-top:16px}.doctor-art{width:100%;aspect-ratio:1}.doctor-animation{display:block;width:100%;height:100%;overflow:hidden}.doctor-intro{font-size:14px;line-height:1.7;color:var(--muted);margin:16px 0 24px}.attention-section{margin:26px 0}.attention-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.attention-card{padding:22px}.attention-card.warm{background:#FFF7E7B3}.attention-label{display:block;color:var(--forest);font-size:10px;line-height:1.5;margin-bottom:12px}.attention-card.warm .attention-label{color:#756031}.attention-card h4{font-weight:600;font-size:14px;line-height:1.5}.attention-card p{font-size:12px;line-height:1.75;color:var(--muted);margin-top:10px}.clinical-footnote,.clinical-links p{font-size:12px;line-height:1.8;color:var(--muted);margin:16px 0 0}.clinical-links{padding:20px}.clinical-links a{color:var(--forest);text-underline-offset:3px}.back-link{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;margin-bottom:8px}.doctor-view .doctor-summary{margin-top:10px}

/* Onest: единая типографика и понятная навигация перед приёмом. */
:root{--font-sans:'Onest',Arial,sans-serif}
html,h1,h2,.brand,.frankl-quote blockquote p{font-family:var(--font-sans)}
h1{font-size:clamp(42px,6.3vw,80px);font-weight:500;letter-spacing:-.055em;line-height:1.06}
h2{font-weight:500;letter-spacing:-.04em}.brand{font-weight:600;letter-spacing:-.9px}
.welcome h1 .word{max-width:100%}.welcome h1 em{font-style:normal;font-weight:500}
.frankl-quote blockquote p{font-weight:400;letter-spacing:-.025em}
.footer{align-items:flex-end}.footer-channel{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}.footer-brand{font-size:12px;font-weight:500;letter-spacing:.015em;color:var(--muted)}
.telegram-link{display:inline-flex;align-items:center;gap:10px;min-height:54px;max-width:100%;padding:10px 13px;border:1px solid #1F6B4A22;border-radius:18px;background:#FFFFFF70;text-decoration:none;color:var(--emerald)}
.telegram-link:hover{background:#FFFFFFA8;border-color:#1F6B4A48}.telegram-icon{width:32px;height:32px;flex:none}.telegram-link .telegram-copy{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-width:0}.telegram-copy strong{font-size:13px;line-height:1.3;font-weight:600}.telegram-copy small{font-size:11px;line-height:1.4;letter-spacing:.015em;color:var(--muted)}.telegram-arrow{width:17px;height:17px;margin-left:6px;flex:none;opacity:.7}.footer-privacy{font-size:10px;line-height:1.7}
@media(max-width:760px){.brand{font-size:clamp(19px,5.2vw,24px);letter-spacing:-.7px}.welcome h1{font-size:clamp(35px,10.5vw,46px)}.footer{align-items:flex-start;gap:18px}.telegram-link{min-height:56px}.frankl-quote blockquote p{font-size:23px}}
@media(max-width:360px){.brand{font-size:19px}.welcome h1{font-size:35px}.frankl-quote blockquote p{font-size:22px}}

/* «Первый шаг»: ботаническая ниша и живая, но спокойная айдентика. */
.brand{gap:12px;flex:none;align-items:center;letter-spacing:-.045em}
.brand-badge{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#FFFFFFB8,#E8F3E37A);border:1px solid #FFFFFFDB;box-shadow:inset 0 1px 0 #fff,0 5px 16px #214A3210;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand .brand-sprout{width:27px;height:30px;overflow:visible}.brand-stem{fill:none;stroke:#1F5A43;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:31;stroke-dashoffset:0;animation:brand-draw .8s var(--ease-out) both}
.brand-sprout-leaf{fill:#4E8F6B;transform-box:fill-box;transform-origin:100% 100%;animation:brand-unfold .75s .55s var(--ease-out) both}.brand-sprout-leaf.right{fill:#1F5A43;transform-origin:0 100%;animation-delay:.7s}
.brand-label{max-width:none;white-space:nowrap;line-height:1.25;overflow:visible}.brand-letter{position:relative;display:inline-block}.brand .brand-letter-leaf{position:absolute;width:.57em;height:.45em;left:.22em;top:-.18em;overflow:visible;transform:rotate(-8deg);animation:brand-mark .8s .9s var(--ease-out) both}
@keyframes brand-draw{from{stroke-dashoffset:31}to{stroke-dashoffset:0}}@keyframes brand-unfold{from{opacity:0;transform:scale(.1) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes brand-mark{from{opacity:0;transform:translateY(3px) rotate(-20deg) scale(.4)}to{opacity:1;transform:translateY(0) rotate(-8deg) scale(1)}}
.welcome{grid-template-columns:minmax(0,1.13fr) minmax(0,.87fr);gap:40px}.welcome-copy{min-width:0}.welcome .meta{margin-bottom:28px}.welcome .private{max-width:340px;font-size:11px;line-height:1.65}
.hero-garden{isolation:isolate;width:100%;aspect-ratio:.81;max-height:550px;opacity:1;overflow:visible;margin:0;position:relative;right:auto;top:auto}
.hero-garden:before{display:none}.plant-niche{position:absolute;inset:12px 16px;border-radius:50% 50% 30px 30px / 43% 43% 30px 30px;background:linear-gradient(155deg,#DCEBDD 8%,#BFD8C4 100%);border:1px solid #EDF7EBD9;box-shadow:inset 0 1px 1px #fff9,inset 0 -30px 80px #63856B16,0 25px 65px #234E3010;overflow:hidden;isolation:isolate}
.plant-niche:after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,#FFFCE44D,transparent 45%,#4474520C);pointer-events:none}
.niche-light{position:absolute;width:90%;height:50%;left:-35%;top:6%;border-radius:48%;background:radial-gradient(ellipse,#FFFCE4A3,transparent 65%);filter:blur(13px);transform:rotate(-28deg);animation:niche-light-drift 20s ease-in-out infinite alternate;pointer-events:none}
.niche-light-second{left:36%;top:48%;width:75%;height:35%;opacity:.55;animation-duration:26s;animation-delay:-9s}
@keyframes niche-light-drift{from{transform:translate3d(-6%,-5%,0) rotate(-28deg);opacity:.45}to{transform:translate3d(23%,17%,0) rotate(-13deg);opacity:.85}}
.art>.hero-plant{position:relative;width:88%;height:94%;overflow:visible;filter:drop-shadow(3px 8px 6px #173D2B10);animation:hero-garden-in 1.4s var(--ease-out) both;transform-origin:50% 92%}
@keyframes hero-garden-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.hero-leaf{transform-box:view-box;animation:hero-leaf-sway 7s ease-in-out infinite alternate}.leaf-one{transform-origin:187px 264px;animation-delay:-2s}.leaf-two{transform-origin:132px 305px;animation-duration:8s;animation-delay:-4s}.leaf-three{transform-origin:263px 289px;animation-duration:6.8s;animation-delay:-1s}.leaf-four{transform-origin:133px 369px;animation-duration:7.6s;animation-delay:-5s}.leaf-five{transform-origin:266px 359px;animation-duration:6.4s;animation-delay:-3s}
@keyframes hero-leaf-sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.garden-chips{position:absolute;inset:0;z-index:2;list-style:none;padding:0;margin:0;pointer-events:none}.garden-chip{position:absolute;display:flex;align-items:center;gap:8px;padding:12px 15px;min-height:43px;white-space:nowrap;border-radius:16px;background:linear-gradient(135deg,#FFFFFFC4,#FFFFFF8A);border:1px solid #FFFFFFE6;-webkit-backdrop-filter:blur(15px) saturate(125%);backdrop-filter:blur(15px) saturate(125%);box-shadow:0 12px 30px #1F5A4310,inset 0 1px 0 #FFFFFFB3;color:#1F5A43;font-size:12px;font-weight:500;line-height:1.4;animation:fade-up 1s var(--ease-out) both;animation-delay:1s}.garden-chip svg{width:17px;height:17px;flex:none}.chip-private{left:-4px;top:27%}.chip-time{right:-5px;top:58%;animation-delay:1.15s}.chip-open{left:6%;bottom:9%;animation-delay:1.3s}.chip-dot{width:6px;height:6px;border-radius:50%;background:#4E8F6B;box-shadow:0 0 0 4px #4E8F6B12}
.paused .hero-leaf,.paused .niche-light,.paused .brand *{animation-play-state:paused!important}
html.calm .hero-leaf,html.calm .niche-light,html.calm .brand *,html.calm .hero-plant,html.calm .garden-chip,.brand-established *{animation:none!important}.calm .brand-stem{stroke-dashoffset:0}

/* Цитата: книжная кавычка и ботаническая виньетка. */
.frankl-quote{padding-left:clamp(30px,4.6vw,56px)}.quote-mark{position:absolute;top:0;left:18px;color:#4E8F6B;opacity:.15;font:190px/.9 Georgia,serif;pointer-events:none;z-index:-1}.frankl-quote blockquote{max-width:calc(100% - 155px)}.frankl-quote figcaption,.frankl-quote .quote-caption{max-width:calc(100% - 155px)}.quote-branch{position:absolute;width:128px;height:201px;right:33px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.85}.quote-twig{transform-box:fill-box;transform-origin:100% 100%;animation:quote-twig-sway 8s ease-in-out infinite alternate}.twig-two{transform-origin:0 100%;animation-delay:-3s;animation-duration:9s}.twig-three{animation-delay:-5s;animation-duration:7s}@keyframes quote-twig-sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
/* Молодой лист раскрывается во внутренней группе, покачивание — во внешней. */
.hero-leaf{animation-duration:7.2s;animation-direction:normal}.leaf-one{animation-duration:8.6s}.leaf-two{animation-duration:7.8s}.leaf-three{animation-duration:6.6s}.leaf-four{animation-duration:5.8s}.leaf-five{animation-duration:7.1s}@keyframes hero-leaf-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.young-leaf-unfurl{transform-box:view-box;transform-origin:187px 264px;animation:young-leaf-unfurl 3.4s .25s var(--ease-out) both}@keyframes young-leaf-unfurl{0%{opacity:.5;transform:rotate(-12deg) scaleX(.16) scaleY(.92)}35%{opacity:1;transform:rotate(-6deg) scaleX(.4) scaleY(.97)}100%{opacity:1;transform:rotate(0) scale(1)}}.garden-established .young-leaf-unfurl{animation:none!important;transform:none;opacity:1}
/* Появление и плавание плашек используют разные анимации одной длительности reveal. */
.chip-time{animation:fade-up 1s 1.15s var(--ease-out) both,chip-float 6.4s 2.15s ease-in-out infinite}.chip-open{animation:fade-up 1s 1.3s var(--ease-out) both,chip-float 7s 2.3s ease-in-out infinite;--chip-direction:-1}@keyframes chip-float{0%,100%{transform:translateY(0)}25%{transform:translateY(calc(-3.5px * var(--chip-direction,1)))}75%{transform:translateY(calc(3.5px * var(--chip-direction,1)))}}
/* Дрейф оконных теней ограничен двумя SVG; геометрия страницы остаётся неподвижной. */
.layer>svg.window-shadow{animation:window-shadow-drift 25s ease-in-out infinite alternate}.layer>svg.shadow-right{animation-duration:29s;animation-delay:-13s;--shadow-x:-1;--shadow-y:-1}@keyframes window-shadow-drift{from{transform:translate3d(calc(-8px * var(--shadow-x,1)),calc(-4px * var(--shadow-y,1)),0)}to{transform:translate3d(calc(10px * var(--shadow-x,1)),calc(5px * var(--shadow-y,1)),0)}}
.paused .young-leaf-unfurl,.paused .garden-chip,.paused .quote-twig{animation-play-state:paused!important}
html.calm .young-leaf-unfurl,html.calm .quote-twig,html.calm .window-shadow{animation:none!important;transform:none!important;opacity:1}

/* Компактное авторство: один абзац, естественный перенос на телефоне. */
.author-footer{display:block;margin:0;font-size:12px;line-height:1.8;color:var(--muted)}.author-footer p{font-size:inherit;line-height:inherit}.author-footer .author-name{white-space:nowrap}.author-footer span:last-child{text-align:left;margin-left:0}.author-footer a{font-size:inherit;font-weight:500;text-decoration:underline;text-decoration-color:#4E8F6B75;text-underline-offset:3px}.author-footer a:hover{text-decoration-color:currentColor}.footer-caution{color:var(--muted)}

/* Размер частиц увеличен умеренно; количество ограничено пятью. */
.selection-particle{width:22px;height:31px;margin:-15px 0 0 -11px}.selection-particle.effect-wind{width:24px;height:33px}.selection-particle.effect-orbit{width:18px;height:26px}.selection-particle.effect-bloom{width:19px;height:27px}

/* IN BLOOM — единый ботанический сюжет; движение не кодирует баллы. */
.botanical-progress{max-width:720px;margin:0 auto 18px}.botanical-progress .progress-label{display:flex;justify-content:space-between;align-items:center;gap:18px;color:var(--muted)}.botanical-progress .progress-label{font-size:11px}
.growth-branch{width:100%;height:auto;max-height:86px;overflow:visible;margin-top:-5px;margin-bottom:-13px}
.branch-guide{fill:none;stroke:#37674812;stroke-width:.8}.branch-stem{fill:none;stroke:#4B7254;stroke-width:1.55;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset 1250ms cubic-bezier(.25,.65,.25,1)}
.branch-leaf{opacity:0;transition:opacity 280ms ease}.branch-leaf.is-complete{opacity:1}.branch-leaf-growth{transform-origin:0 0}
.branch-bud{opacity:0;transition:opacity 1000ms ease,transform 1250ms cubic-bezier(.25,.65,.25,1)}.branch-bud.is-visible{opacity:1}.branch-bloom{opacity:0;transition:opacity 1200ms ease}.branch-bud.is-flowering .branch-bloom{opacity:1}

.bloom-story{position:relative;width:calc(100vw - 2px);left:50%;margin-left:calc(-50vw + 1px);isolation:isolate;background:linear-gradient(115deg,#F6F7EEA3,#EAF0E48C);margin-top:-15px;margin-bottom:48px;overflow:hidden}

.bloom-editorial{width:min(1180px,100%);padding:clamp(36px,5vw,78px) clamp(24px,5vw,68px) 30px;margin:auto;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:center;gap:0;min-height:min(740px,86svh)}
.bloom-copy{position:relative;z-index:1;padding-bottom:40px}
.bloom-kicker{display:flex;align-items:center;gap:13px;color:#47654F;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;margin-bottom:30px;opacity:var(--bloom-copy-opacity,1)}.bloom-kicker>span{color:#9BAE94;font-weight:400}
.bloom-title-mask{overflow:hidden;padding:3px 0 9px;margin-bottom:19px}
.bloom-title{font-family:'Onest',Arial,sans-serif;font-weight:400;font-size:clamp(42px,5.4vw,76px);line-height:1.06;letter-spacing:-.065em;text-wrap:initial;transform:translate3d(0,var(--bloom-title-y,0px),0)}
.bloom-title em{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.055em;color:#40654C}
.bloom-message{font-size:14px;line-height:1.9;max-width:370px;color:#405A48;opacity:var(--bloom-copy-opacity,1)}
.bloom-skip{display:inline-flex;align-items:center;gap:30px;min-height:48px;padding:11px 0;color:#244F39;font-size:12px;font-weight:500;text-decoration:none;border-bottom:1px solid #426F4840;margin-top:26px;transition:color 300ms ease}
.bloom-skip span{font-size:22px;font-weight:400;transition:transform 450ms var(--ease-out)}.bloom-skip:hover span{transform:translate(3px,3px)}
.bloom-footnote{font-size:10px;line-height:1.7;color:#62725D;margin-top:30px;letter-spacing:.01em}

.magnolia-leaf-flex{transform-origin:0 0}

.bloom-specimen>span{display:block;margin-top:6px;color:#6F7C66;font-family:'Onest',Arial,sans-serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase}
.bloom-result-actions{margin:0 0 32px}.result-heading .bloom-final-message{font-size:13px;line-height:1.8}

.paused .bloom-story *{animation-play-state:paused!important}
.calm .branch-stem,.calm .branch-leaf,.calm .branch-bud,.calm .branch-bloom,.calm .result-card{transition:none!important}.calm .bloom-title{transform:none}.calm .result-card.is-pending{opacity:1;transform:none}

.nature>.morning-window{position:absolute;inset:-2.2%;background:#e6e6d3 var(--day-photo) center / cover no-repeat;transform-origin:55% 75%;animation:window-drift 38s ease-in-out infinite alternate}
.nature>.morning-window::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,252,239,.12),rgba(245,248,234,.16) 55%,rgba(232,235,214,.08))}
.nature>:not(.morning-window):not(.studio-glass){display:none}
@keyframes window-drift{from{transform:translate3d(-.42%,-.16%,0) rotate(-.22deg) scale(1.004)}to{transform:translate3d(.52%,.20%,0) rotate(.23deg) scale(1.017)}}
.paused .morning-window{animation-play-state:paused}
.still-life-story{margin-top:-15px;background:transparent}
.still-life-story::before{background:linear-gradient(90deg,#f3efe3aa,#efece187 36%,transparent 64%);opacity:1}
.still-life-story .bloom-editorial{position:relative;width:min(100%,1490px);grid-template-columns:minmax(0,40fr) minmax(0,60fr);min-height:0;padding:0;gap:0}
.still-life-story .bloom-copy{z-index:2;margin-left:clamp(28px,8.6vw,143px);margin-right:-20px;padding:40px 0}
.still-life-story .bloom-title{font-size:clamp(43px,5.1vw,80px)}
.still-life-story .bloom-title em{color:#69765d}
.still-life-story .bouquet-visual{position:relative;display:block;align-self:center;width:100%;height:auto;min-height:0;margin:0;padding:0;aspect-ratio:884/916;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 95%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 95%,transparent)}
.morning-plate{display:block;width:100%;height:100%;mask-image:linear-gradient(to bottom,transparent,#000 2%,#000 96%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 2%,#000 96%,transparent)}
.still-life-story .bloom-copy{animation:morning-copy 1.05s var(--ease-out) both}
.still-life-story .morning-plate{animation:morning-arrival 1.35s ease-out both}
@keyframes morning-arrival{from{opacity:.08}to{opacity:1}}
@keyframes morning-copy{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:760px){
 .nature>.morning-window{background-position:53% center}
 .still-life-story .bloom-editorial{display:flex;flex-direction:column;align-items:stretch;padding:0;gap:0}
 .still-life-story .bloom-copy{margin:0;padding:30px max(23px,env(safe-area-inset-left)) 10px}
 .still-life-story .bloom-title{font-size:clamp(39px,10.2vw,62px)}
 .still-life-story .bouquet-visual{width:min(100%,550px);height:auto;margin:0 auto;padding:0}
 .still-life-story .morning-plate{mask-image:linear-gradient(to bottom,transparent,#000 3%,#000 96%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 3%,#000 96%,transparent)}
}
@media(prefers-reduced-motion:reduce){.nature>.morning-window,.still-life-story .bloom-copy,.still-life-story .morning-plate{animation:none}}

.entry-photo{position:absolute;z-index:-1;left:50%;top:-105px;bottom:0;width:100vw;transform:translateX(-50%);background:#d8d9c6 var(--room-photo) right 72%/cover no-repeat;mask-image:linear-gradient(#000 95%,transparent)}
.entry-room .welcome{display:block}
.entry-room .welcome-copy{max-width:min(53%,630px);padding:0}
.entry-room .intro,.entry-room .meta,.entry-room .private{color:#314a39}
.entry-room h1{font-size:clamp(44px,5.6vw,84px);line-height:.99}
.entry-room .garden-chips{position:static;display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px}
.entry-room .garden-chip{position:static;min-height:28px;border-radius:20px;padding:5px 10px;background:#f9faeeb3;color:#304c37;font-size:11px;box-shadow:inset 0 1px #fff9;animation:none}
.entry-room .garden-chip svg{width:13px;height:13px}
.entry-room .meta{margin:14px 0 0}
.entry-room .frankl-quote{width:min(56%,610px);margin:0;padding:18px 31px 18px 36px;border:1px solid #fbf9eccc;background:linear-gradient(116deg,#f7f5e8c7,#f4f1de85);box-shadow:0 7px 24px #303b2110,inset 0 1px 0 #fff9}
.entry-room .frankl-quote blockquote p{font-size:clamp(17px,1.6vw,24px);line-height:1.28}
.entry-room .frankl-quote .quote-branch{opacity:.28}
body[data-room="entry"] .stage{padding-top:12px}
body[data-room="entry"] .header{position:relative;z-index:1}
@media(max-width:760px){
 .entry-room{min-height:0;gap:12px;padding:16px 0 20px}
 .entry-room .welcome-copy{max-width:none}
 .entry-room h1{font-size:clamp(36px,9vw,54px)}
 .entry-room .intro{max-width:34ch;margin-top:14px}
 .entry-room .garden-chips{margin:12px 0 15px}
 .entry-room .entry-photo{position:relative;grid-row:2;top:auto;bottom:auto;z-index:0;height:clamp(180px,48vw,295px);width:100vw;background-size:auto 115%;background-position:100% 97%;background-color:#d9dbc9;mask-image:linear-gradient(transparent,#000 14%,#000 87%,transparent)}
 .entry-room .welcome{grid-row:1}
 .entry-room .frankl-quote{width:100%;grid-row:3;padding:18px 23px}
 .entry-room .frankl-quote blockquote p{font-size:19px}
}
/* Финальная обложка занимает остаток экрана между шапкой и подписью врача.
   Обычная высота текста остаётся нижней границей при увеличении шрифта. */
@media screen{
 body[data-view="cover"] .shell{box-sizing:border-box;min-height:100svh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:0;padding-block:max(12px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-bottom))}
 body[data-view="cover"] .stage,body[data-view="cover"] .results{display:block;margin:0;min-height:0;height:100%;padding:0;max-width:none}
 body[data-view="cover"] .still-life-story{height:100%;margin-block:0}
 body[data-view="cover"] .bloom-editorial{height:100%;min-height:0;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
 body[data-view="cover"] .bouquet-visual{width:100%;height:100%;aspect-ratio:auto;min-height:0}
 body[data-view="cover"] .bloom-copy{padding-block:12px}
 body[data-view="cover"] .morning-plate{height:100%;width:100%}
 body[data-view="cover"] .author-footer{font-size:11px;padding:6px 0 0;line-height:1.45}
 body[data-view="cover"] .report-body,body[data-view="report"] .still-life-story{display:none}
 body[data-view="report"] .report-body{animation:fade-in .5s both}
}
@media screen and (max-width:760px) and (orientation:portrait){
 body[data-view="cover"] .bloom-editorial{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(100px,1fr)}
 body[data-view="cover"] .bloom-copy{margin:0;padding:clamp(10px,2vh,24px) max(22px,env(safe-area-inset-left)) 0}
 body[data-view="cover"] .bloom-kicker{margin-bottom:9px}
 body[data-view="cover"] .bloom-title-mask{margin-bottom:6px;padding-bottom:4px}
 body[data-view="cover"] .bloom-title{font-size:clamp(31px,min(9.8vw,5.8svh),54px)}
 body[data-view="cover"] .bloom-message{font-size:clamp(12px,3.25vw,15px);line-height:1.45;max-width:42ch}
 body[data-view="cover"] .bloom-skip{margin-top:4px;min-height:44px}
 body[data-view="cover"] .bloom-footnote{margin-top:3px}
 body[data-view="cover"] .bouquet-visual{max-width:100%;margin:0;padding:0}
 body[data-view="cover"] .author-footer{font-size:10px}
}
@media screen and (orientation:landscape) and (max-height:550px){
 body[data-view="cover"] .bloom-editorial{display:grid}
 body[data-view="cover"] .bloom-copy{margin-left:5vw;padding:5px 0}
 body[data-view="cover"] .bloom-title{font-size:clamp(25px,4.6vw,44px)}
 body[data-view="cover"] .bloom-kicker,body[data-view="cover"] .bloom-title-mask{margin-bottom:6px}
 body[data-view="cover"] .bloom-message{font-size:12px;line-height:1.45}
 body[data-view="cover"] .bloom-skip,body[data-view="cover"] .bloom-footnote{margin-top:3px}
}

.entry-room h1 em{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-style:italic}
.entry-room .frankl-quote blockquote{max-width:90%}
.entry-room .frankl-quote figcaption{margin-top:8px}
.entry-room .quote-caption{margin-top:3px}
@media(min-width:761px) and (max-height:820px){
 .entry-room{padding:16px 0 24px;gap:16px}
 .entry-room h1{font-size:clamp(42px,7.75svh,62px)}
 .entry-room .intro{margin:14px 0 8px}
 .entry-room .garden-chips{margin:8px 0 12px}
 .entry-room .private{margin-top:9px}
 .entry-room .frankl-quote{padding-block:13px}
}

@media screen{
 body[data-view="cover"] .stage{display:grid;grid-template-rows:minmax(0,1fr);align-items:stretch}
 body[data-view="cover"] .stage>.screen[aria-hidden="true"]{overflow:clip;max-height:100%}
 body[data-view="cover"] .bouquet-visual{display:flex;align-items:center;justify-content:center;container-type:size;mask:none;-webkit-mask:none}
 body[data-view="cover"] .morning-plate{display:block;width:min(100cqw,96.5cqh);height:auto;max-width:100%;max-height:100%;
 mask-image:linear-gradient(90deg,transparent,#000 6%,#000 89%,transparent),linear-gradient(180deg,transparent,#000 3%,#000 91%,transparent);mask-composite:intersect}
}
body[data-room="entry"] .header-note{color:#304834;background:#f3f3dfb8;border-radius:18px;padding:6px 10px}

.brand{gap:12px}

 body .glass,body .entry-room .frankl-quote{
   --sheet:rgba(244,246,234,.66);
   border:1px solid;border-color:rgba(255,255,248,.89) rgba(140,151,125,.42) rgba(102,120,99,.42) rgba(255,255,247,.75);
   border-radius:clamp(15px,1.65vw,23px);
   background:var(--satin-grain) repeat,var(--sheet);
   -webkit-backdrop-filter:blur(10px) saturate(83%) contrast(.96);
   backdrop-filter:blur(10px) saturate(83%) contrast(.96);
   box-shadow:inset 0 1px 1px #fffdf2aa,inset 2px 0 2px #fffbed6e,inset -1px -1px 1px #65715c15,0 3px 7px #3946310b,0 17px 41px -17px #35432d38;
 }
 body .entry-room .frankl-quote{--sheet:rgba(246,242,221,.52)}
 body .glass.warm{--sheet:rgba(248,242,223,.78)}
 body[data-room="quiet"] .glass{--sheet:rgba(247,248,235,.62)}
 body[data-room="quiet"] .question{color:#183b2c}
 body[data-room="quiet"] .question-context,body[data-room="quiet"] .muted{color:#3d5547}
 body[data-room="quiet"] .answer{background:#f7f8ef94;border:1px solid #75887565;box-shadow:inset 0 1px #fffff596;color:#183b2c}
 body[data-room="quiet"] .answer:before{background:#c1d6c3}
 body[data-room="quiet"] .answer[aria-checked="true"]{border-color:#486c54;box-shadow:inset 0 0 0 1px #486c543b}
 body[data-view="question"] .has-answer .primary:not(.is-flowing)::before,
 body[data-view="question"] .has-answer .next:not(.is-flowing){animation:none}
 .nature>.morning-window,body[data-room] .nature>.quiet-window{animation:none;transform:none;overflow:hidden}
 body[data-room] .nature>.quiet-window{inset:0;background:var(--quiet-photo) center/cover no-repeat}
 .nature>.quiet-window::after{content:"";position:absolute;inset:0;background:rgba(244,246,229,.37)}
 .nature>.morning-window{inset:0}
 .entry-room .entry-photo{overflow:hidden}
 .conservatory-optics{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0;pointer-events:none}
 .conservatory-optics.ready{opacity:1}
 .nature>.studio-glass{background:none;box-shadow:inset 1px 1px #fff9,inset -1px -1px #6d75551d}
 .vase-specular{opacity:0;pointer-events:none;animation:vase-reflection 4.6s ease-in-out both}
 @keyframes vase-reflection{0%,100%{opacity:0;transform:translateX(0)}35%{opacity:.36}72%{opacity:.12;transform:translateX(1.5px)}}
 .paused .vase-specular{animation-play-state:paused}
 .calm .vase-specular,.still-life-story[data-flower-settled="true"] .vase-specular{display:none}
 @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){body .glass,body[data-room="quiet"] .glass{--sheet:#eff1e4ef}}
}
@media(max-width:760px){.entry-room .entry-photo{background-size:cover;background-position:right 72%}}
@media(prefers-reduced-motion:reduce){.vase-specular,.conservatory-optics{display:none}}
@media(forced-colors:active){.glass,.answer{border:1px solid CanvasText!important}.conservatory-optics{display:none}}
@media print{.conservatory-optics,.vase-specular{display:none!important}}

function readiness(q){
  if(!q.verifiedText || q.questions.some(item=>/\[ВСТАВИТЬ/.test(item.text)||item.options.some(o=>/\[ВСТАВИТЬ/.test(o.label)))) return 'Официальный бланк ещё не добавлен';
  if(!q.verifiedKey || !Array.isArray(q.reverseItems) || q.questions.some(item=>item.options.some(o=>!Number.isFinite(o.points)))) return 'Ключ требует проверки';
  if(!Number.isFinite(q.min)||!Number.isFinite(q.max)) return 'Диапазон требует проверки';
  if(q.scoringMode!=='sumOnly' && (!Array.isArray(q.thresholds)||!q.thresholds.length)) return 'Порог требует проверки';
  return '';
}
function valuesFor(q,answers){
  if(!Array.isArray(answers)||answers.length!==q.questions.length) return null;
  const values=q.questions.map((item,i)=>{
    const answer=answers[i];
    if(!Number.isInteger(answer)||answer<0||answer>=item.options.length) return NaN;
    const value=item.options[answer].points;
    if(!Number.isFinite(value)) return NaN;
    return q.reverseItems.includes(i+1)?q.reverseBounds[0]+q.reverseBounds[1]-value:value;
  });
  return values.every(Number.isFinite)?values:null;
}
function metric(q,title,total,min,max){
  total=Math.round((total+Number.EPSILON)*100)/100;
  const band=q.thresholds?.find(b=>total>=b.min&&total<=b.max),sumOnly=q.scoringMode==='sumOnly';
  if(total<min||total>max||(!band&&!sumOnly)) return {scale:q.name,title,total:null,min,max,available:false,message:'Проверьте диапазон и пороги'};
  return {scale:q.name,title,total,min,max,available:true,decimals:q.decimals||0,high:!sumOnly&&total>q.thresholds[0].max,message:sumOnly?q.interpretations.sum:band.label};
}
function compute(q,answers){
  const reason=readiness(q), values=reason?null:valuesFor(q,answers);
  const unavailable=title=>({scale:q.name,title,total:null,min:q.min,max:q.max,available:false,message:reason||'Ответы заполнены не полностью'});
  if(q.subscales.length) return q.subscales.map(s=>values?metric(q,s.name,s.items.reduce((sum,n)=>sum+values[n-1],0),q.min,q.max):unavailable(s.name));

}

function buildClinicianSummary(rows,profile){
  const number=value=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value);
  const sex={male:'мужской',female:'женский',unspecified:'не указан'}[profile.sex]||'не указан';
  const lines=[`Скрининговое обследование по данным самоотчёта. Возраст: ${profile.age||'не указан'}; пол: ${sex}.`];
  const hads=rows.filter(r=>r.scale==='HADS');
  if(hads.length===2&&hads.every(r=>r.available)){
    const grade=value=>value<8?'ниже скринингового порога':value<11?'субклиническая выраженность симптомов по шкале':'клиническая выраженность симптомов по шкале';
    lines.push(`HADS-A: ${number(hads[0].total)}/21, ${grade(hads[0].total)}. HADS-D: ${number(hads[1].total)}/21, ${grade(hads[1].total)}.`);
  }
  for(const row of rows){
    if(row.scale==='HADS')continue;
    if(!row.available){lines.push(`${row.scale}: результат недоступен; ${row.message}.`);continue}
    const value=`${number(row.total)}/${number(row.max)}`;
    if(row.scale==='AQ-10')lines.push(`AQ-10: ${value}; скрининговый порог ${row.high?'достигнут':'не достигнут'}.`);
    if(row.scale==='ASRS-5')lines.push(`ASRS-5: ${value}, простая сумма ответов. Пороговая интерпретация не проводилась: взвешенный ключ в этой версии не используется.`);
    if(row.scale==='BIS-brief')lines.push(`BIS-brief: ${value}; сумма баллов, без диагностической категоризации.`);
    if(row.scale==='HCL-8')lines.push(`HCL-8: ${value}, взвешенная русская версия; порог 9,3 ${row.high?'достигнут':'не достигнут'}.`);
  }
  const directions=[];
  if(hads.some(r=>r.available&&r.high))directions.push('выраженность и длительность тревожных и депрессивных симптомов');
  if(rows.some(r=>r.scale==='AQ-10'&&r.available&&r.high))directions.push('анамнез развития и особенности социальной коммуникации');
  if(rows.some(r=>r.scale==='HCL-8'&&r.available&&r.high))directions.push('наличие, продолжительность и последствия периодов подъёма настроения и активности');
  if(directions.length)lines.push(`При клиническом интервью целесообразно уточнить: ${directions.join('; ')}.`);
  lines.push('Результаты скрининга не являются диагнозом и не позволяют установить или исключить расстройство без клинической оценки.');
  return lines.join('\n\n');
}

function validateProfile(profile){
  const errors={};
  if(!['male','female','unspecified'].includes(profile.sex))errors.sex='Укажите пол или выберите «Не хочу указывать».';
  const raw=String(profile.age??'').trim(),age=Number(raw);
  if(!/^\d{1,3}$/.test(raw)||!Number.isInteger(age)||age<1||age>120)errors.age='Введите возраст целым числом от 1 до 120 лет.';
  else if(age<18)errors.age='Этот набор опросников предназначен для взрослых от 18 лет. Для вашего возраста нужен другой набор.';
  return errors;
}

function flowerHead(id,prefix,paintPrefix=prefix,flower=FLOWER_COLLECTION[id],modelLight=false){
 const parts=flower.parts.map((p,i)=>{
  const cid=prefix+'-p'+i;
  const azimuth=(p.angle+flower.tilt)*Math.PI/180;
  const fx=(.47-.24*Math.cos(azimuth)+.09*Math.sin(azimuth)).toFixed(2);

 });

 }
 if(flower.kind==='ranunculus')heart='<g class="collection-heart" fill="#A6A474">'+Array.from({length:15},(_,i)=>{const a=i*2.4,r=Math.sqrt(i)*1.9;return `<path d="M0 2Q${Math.cos(a)*r} ${Math.sin(a)*r} ${Math.cos(a)*r*1.2} ${Math.sin(a)*r*1.2-2}" fill="none" stroke="#A1A06A" stroke-width=".75"/>`}).join('')+'</g>';
 if(flower.kind==='iris')heart='<g class="collection-heart" fill="none" stroke-linecap="round">'+[-47,0,47].map((x,i)=>`<path d="M${x*.22} 9Q${x*.7} ${27-i*3} ${x} ${i===1?62:39}" stroke="#B9A26B" stroke-width="3"/><path d="M${x*.22+1} 9Q${x*.7+1} ${25-i*3} ${x+1} ${i===1?60:37}" stroke="#E2CF99" stroke-width="1.2"/>`).join('')+'</g>';
 if(flower.kind==='calla'){
  const spike=`<g class="collection-heart calla-spadix"><path d="M4 4C-1-18 0-54 6-67C11-74 18-68 18-57C18-35 16-11 13-2Z" fill="url(#${paintPrefix}-gold)" stroke="#B3A36C" stroke-width=".4"/>${Array.from({length:28},(_,i)=>{const x=5+(i%3)*3.3,y=-59+Math.floor(i/3)*5.8;return `<path d="M${x} ${y}l1.2 1.6" stroke="#8B8D55" stroke-opacity=".3" stroke-width=".7"/>`}).join('')}</g>`;
  parts.splice(1,0,spike);
 }

}

// Два плана раскрываются в разное время. На границах лепестков смещение
// плавно уменьшается до нуля. Нижнюю часть с водой и стеклом рисуем один раз.
function createStillLifeController(host){
 const moving=host.querySelector('.moving-petals');
 const [back,front]=host.querySelectorAll('feDisplacementMap');
 const skip=host.querySelector('.bloom-skip');
 let frame=0,lastFrame=null,elapsed=0,visible=true,finished=false,disposed=false;
 const remaining=(t,delay,duration)=>1-botanicalEase(clamp01((t-delay)/duration));
 function stop(){
  cancelAnimationFrame(frame);frame=0;lastFrame=null;
 }
 function settle(){
  stop();finished=true;moving.style.display='none';host.dataset.flowerSettled='true';
 }
 function draw(now){
  frame=0;
  if(lastFrame!==null)elapsed+=now-lastFrame;lastFrame=now;
  if(elapsed>=4600){settle();return}
  moving.style.display='';
  back.setAttribute('scale',(60*remaining(elapsed,210,3250)).toFixed(2));
  front.setAttribute('scale',(60*remaining(elapsed,860,3740)).toFixed(2));
  frame=requestAnimationFrame(draw);
 }
 function update(){
  if(disposed)return;
  if(reduce()){settle();return}
  if(document.hidden||!visible){stop();return}
  if(!finished&&!frame)frame=requestAnimationFrame(draw);
 }
 function jump(event){
  event.preventDefault();settle();
  document.body.dataset.view='report';
  window.scrollTo({top:0,behavior:'instant'});
  stage.querySelector('#screen-title').focus({preventScroll:true});
 }
 const observer=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{
  visible=entries[0].isIntersecting;update();
 }):null;
 observer?.observe(host);skip.addEventListener('click',jump);update();
 return {update,dispose(){disposed=true;stop();observer?.disconnect();skip.removeEventListener('click',jump)}};
}

function bloomStory(){return `<section class="bloom-story collection-story still-life-story" aria-labelledby="bloom-title"><div class="bloom-editorial"><div class="bloom-copy"><p class="bloom-kicker">Первый шаг <span aria-hidden="true">/</span> In bloom</p><div class="bloom-title-mask"><h2 class="bloom-title" id="bloom-title" tabindex="-1">Вы сделали<br>первый <em>шаг.</em></h2></div><p class="bloom-message">Вы уделили время своему психическому состоянию. Сохраните результаты обследования и обсудите их со специалистом.</p><a class="bloom-skip" href="#results-summary">Перейти к результатам <span aria-hidden="true">↘</span></a><p class="bloom-footnote">Внимание к себе — начало понимания.</p></div><div class="bloom-visual bouquet-visual">${bouquetSVG()}</div></div></section>`}
// Один rAF на композицию, готовые интерполяторы и ссылки на узлы без поиска в кадре.
function prepareFlowerMotion(host,detailAt=0){
 const groups=[...host.querySelectorAll('[data-flower-kind]')];
 const parts=groups.flatMap(group=>{
  const offset=Number(group.closest('[data-flower-offset]')?.dataset.flowerOffset||0);
  return [...group.querySelectorAll('[data-corolla-part]')].map(part=>{
   const surface=part.querySelector('.collection-surface'),clip=part.querySelector('.collection-clip'),etching=part.querySelector('.collection-etching');
   const morph=pathBetween(part.dataset.closed,surface.getAttribute('d'));
   return {part,surface,clip,etching,morph,offset:offset+Number(part.dataset.onset),turn:Number(part.dataset.turn),angle:Number(part.getAttribute('transform').match(/-?\d*\.?\d+/)[0]),last:-1,lastEtching:-1,lastTurn:Infinity};
  });
 });
 const hearts=groups.flatMap(group=>[...group.querySelectorAll('.collection-heart')].map(node=>({node,offset:Number(group.closest('[data-flower-offset]')?.dataset.flowerOffset||0)})));
 const stems=[...host.querySelectorAll('.collection-stem,.bouquet-stems')],foliage=[...host.querySelectorAll('.specimen-foliage,.bouquet-foliage')];
 return ms=>{
  parts.forEach(p=>{
   const t=botanicalEase(clamp01((ms-p.offset)/1180));if(t===p.last)return;p.last=t;
   const path=p.morph(t);p.surface.setAttribute('d',path);
   const detail=detailAt?clamp01((t-detailAt)/(1-detailAt)):.1+.9*t;if(detail>0)p.clip.setAttribute('d',path);if(detail!==p.lastEtching){p.etching.style.opacity=String(detail);p.lastEtching=detail}
   const turn=p.angle+p.turn*(1-t)*(1-t);if(Math.abs(turn-p.lastTurn)>.025||t===1){p.part.setAttribute('transform',`rotate(${turn})`);p.lastTurn=turn}
  });
  hearts.forEach(h=>{const t=clamp01((ms-h.offset-320)/850);if(t!==h.last){h.node.style.opacity=String(t);h.last=t}});
  stems.forEach(node=>node.style.opacity=String(.55+.45*clamp01(ms/800)));
  foliage.forEach(node=>node.style.opacity=String(.6+.4*clamp01(ms/1000)));
 };
}
function createCollectionController(host,fresh=true){
 let raf=0,started=null,elapsed=fresh?0:4000,disposed=false;
 const paintFlowers=prepareFlowerMotion(host);
 function paint(ms){paintFlowers(reduce()?4000:ms)}
 function stop(){cancelAnimationFrame(raf);raf=0;started=null}
 function tick(now){raf=0;if(disposed||document.hidden||reduce())return;if(started===null)started=now-elapsed;elapsed=now-started;paint(elapsed);if(elapsed<1750)raf=requestAnimationFrame(tick);else{paint(4000);host.dataset.flowerSettled='true'}}
 function update(){if(disposed)return;if(reduce()){stop();elapsed=4000;paint(4000);host.dataset.flowerSettled='true';return}if(document.hidden){stop();return}if(elapsed<1750&&!raf)raf=requestAnimationFrame(tick)}
 paint(elapsed);if(!fresh)host.dataset.flowerSettled='true';update();
 return {update,dispose(){disposed=true;stop()}};
}
function syncBloomStory(){
 const screen=stage.lastElementChild,host=screen?.querySelector('.bloom-story')||null,specimen=screen?.querySelector('.flower-interlude')||null;
 if(host!==bloomHost){bloomController?.dispose();bloomController=null;bloomHost=host;if(host)bloomController=createStillLifeController(host)}
 if(specimen!==interludeHost){interludeController?.dispose();interludeController=null;interludeHost=specimen;if(specimen){const id=specimen.dataset.specimen,fresh=!seenFlowers.has(id);seenFlowers.add(id);interludeController=createCollectionController(specimen,fresh)}}
}
function controlBotanicalMotion(){
 bloomController?.update();interludeController?.update();if(reduce()||document.hidden){stopBotanicMotions();stage.querySelectorAll('[data-scale-leaf]').forEach(group=>{delete group.dataset.growing});syncProgressBranch()}
}

const formatScore=(value,decimals=2)=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:decimals}).format(value);

const sexLabels={male:'Мужской',female:'Женский',unspecified:'Не указан'};
function adaptWording(text,sex){
  if(!['male','female'].includes(sex))return text;
  const index=sex==='female'?1:0;
  const forms=[
    ['Я стал (стала) менее застенчивым (застенчивой) и «закомплексованным» («закомплексованной»).','Я стал менее застенчивым и «закомплексованным».','Я стала менее застенчивой и «закомплексованной».'],
    ['отвлекался (отвлекалась)','отвлекался','отвлекалась'],
    ['напуган(а)','напуган','напугана'],['способен(на)','способен','способна'],
    ['жизнерадостный(ная)','жизнерадостный','жизнерадостная'],
    ['замедленным(ой)','замедленным','замедленной'],['стал(а)','стал','стала'],
    ['согласен(на)','согласен','согласна'],['невнимательный(-ая)','невнимательный','невнимательная'],
    ['аккуратен(-на)','аккуратен','аккуратна'],['осторожен(-на)','осторожен','осторожна'],
    ['говорил(а)','говорил','говорила'],['шутил(а)','шутил','шутила'],['каламбурил(а)','каламбурил','каламбурила'],
    ['раздражал(а)','раздражал','раздражала'],['утомлял(а)','утомлял','утомляла'],
    ['энергичным(ой)','энергичным','энергичной'],['активным(ой)','активным','активной'],['приподнятым(ой)','приподнятым','приподнятой']
  ];
  return forms.reduce((value,[original,male,female])=>value.split(original).join(index?female:male),text);
}
const wording=text=>adaptWording(text,state.profile.sex);
function profileSummary(){return `Пол: ${sexLabels[state.profile.sex]||'не указан'} · Возраст: ${state.profile.age||'не указан'}`}
function profileScreen(){return `<section class="screen" aria-labelledby="screen-title"><div class="profile-card glass"><div class="eyebrow">Перед началом</div><h2 id="screen-title" tabindex="-1">Пара слов о вас.</h2><p class="profile-description">Укажите пол и возраст. Они останутся только в этой вкладке и попадут в отчёт для врача.</p><form id="profile-form" novalidate><fieldset class="profile-sex" aria-describedby="sex-error"><legend>Пол</legend><div class="profile-sex-options">${[['male','Мужской'],['female','Женский'],['unspecified','Не хочу указывать']].map(([value,label])=>`<label class="profile-choice"><input type="radio" name="sex" value="${value}" ${state.profile.sex===value?'checked':''} required><span>${label}</span></label>`).join('')}</div></fieldset><p class="field-error" id="sex-error" aria-live="polite"></p><label class="age-label" for="profile-age">Возраст, полных лет</label><input class="age-input" id="profile-age" name="age" type="number" min="1" max="120" step="1" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="${esc(state.profile.age)}" aria-describedby="age-error" required><p class="field-error" id="age-error" aria-live="polite"></p><p class="profile-rule">Возраст проверяет, подходит ли взрослый набор опросников. Пол определяет грамматическую форму вопросов и отражается в отчёте. Баллы и пороги шкал по этим данным автоматически не изменяются.</p><div class="navigation"><button type="button" class="text-button" data-action="profile-back"><span>← Назад</span></button><button type="submit" class="button primary">К опросникам ${arrow}</button></div></form></div></section>`}
function submitProfile(event){
  event.preventDefault();if(state.busy)return;
  const form=event.target;
  state.profile.sex=form.querySelector('input[name="sex"]:checked')?.value||'';
  state.profile.age=form.querySelector('[name="age"]').value.trim();
  const errors=validateProfile(state.profile);
  document.getElementById('sex-error').textContent=errors.sex||'';
  document.getElementById('age-error').textContent=errors.age||'';
  const fieldset=form.querySelector('fieldset'),age=form.querySelector('[name="age"]');
  fieldset.setAttribute('aria-invalid',String(!!errors.sex));
  form.querySelectorAll('input[name="sex"]').forEach(input=>input.setAttribute('aria-invalid',String(!!errors.sex)));
  age.setAttribute('aria-invalid',String(!!errors.age));
  if(errors.sex){form.querySelector('input[name="sex"]').focus();return}
  if(errors.age){age.focus();return}
  state.profile.age=String(Number(state.profile.age));age.blur();
  navigate(()=>{state.screen='breath';state.scale=0;state.item=0});
}

// Переходы ограничены содержимым. Листва, свет и стекло не пересоздаются.
const transitionAnimations=new Set(),questionHeightCache=new Map();
let lastSelectionAt=-Infinity,lastActionGlowAt=-Infinity;
const advanceTimers=new WeakMap();
function illuminateAdvance(button){

const phoneLayout=matchMedia('(max-width:760px), (max-width:1024px) and (pointer:coarse)');
function syncPhoneDock(){
 const home=document.querySelector('.home-control');if(home)home.disabled=state.busy||state.screen==='welcome';
 const visible=phoneLayout.matches&&state.screen==='question',dock=document.getElementById('phone-dock');
 dock.hidden=!visible;document.body.classList.toggle('phone-question',visible);
 if(!visible)return;
 const q=scales[state.scale],ready=Number.isInteger(state.answers[q.id][state.item]);
 dock.querySelectorAll('button').forEach(button=>button.disabled=state.busy);
 dock.classList.toggle('has-answer',ready);
 document.getElementById('phone-next-label').textContent=state.scale===scales.length-1&&state.item===q.questions.length-1?'К результатам':'Далее';
}
phoneLayout.addEventListener('change',()=>{syncPhoneDock();questionHeightCache.clear();if(state.screen==='question'&&!state.busy)stabilizeQuestion()});
// Тихая пауза после выбора и разнесённое появление текста: стекло остаётся неподвижным.
const MOTION={feedbackHold:700,pressHold:320,out:600,in:1320,answer:1100,overlap:410,stagger:45,easing:'cubic-bezier(.4,0,.2,1)'};
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function screenMarkup(){return state.screen==='welcome'?welcome():state.screen==='profile'?profileScreen():state.screen==='breath'?breath():state.screen==='question'?question():state.screen==='doctor'?doctorPage():resultPage()}
function announceScreen(){
  const current=stage.lastElementChild;
  current?.querySelector(document.body.dataset.view==='cover'?'#bloom-title':'#screen-title')?.focus({preventScroll:true});
  announcer.textContent=state.screen==='question'?`${scales[state.scale].name}. Вопрос ${state.item+1} из ${scales[state.scale].questions.length}.`:state.screen==='doctor'?'Для врача. Сводка и ориентиры беседы.':state.screen==='results'?'Опрос завершён. Страница результатов.':state.screen==='breath'?`${scales[state.scale].name}. Инструкция.`:state.screen==='profile'?'Укажите пол и возраст.':'Начало опроса.';
}
function stabilizeQuestion(){
  const card=stage.lastElementChild?.querySelector('.question');if(!card)return;
  const width=Math.round(card.getBoundingClientRect().width);if(!width)return;
  const key=scales[state.scale].id+':'+width+':'+(document.fonts?.status||'ready');
  let height=questionHeightCache.get(key);
  if(!height){
    const measure=document.createElement('div');measure.className='question-measure';measure.setAttribute('aria-hidden','true');measure.inert=true;measure.style.width=width+'px';
    const template=document.createElement('template');
    scales[state.scale].questions.forEach((_,i)=>{template.innerHTML=question(i);const clone=template.content.querySelector('.question');clone.style.minHeight='0';measure.append(clone)});
    document.body.append(measure);
    height=Math.ceil(Math.max(...[...measure.children].map(child=>child.getBoundingClientRect().height)));
    measure.remove();questionHeightCache.set(key,height);
  }
  card.style.minHeight=height+'px';
}
function render(focus=true,append=false){
  cancelAnimationFrame(renderFrame);renderFrame=0;resultObserver?.disconnect();
  const previousView=document.body.dataset.view;
  document.body.dataset.room=state.screen==='welcome'?'entry':['results','doctor'].includes(state.screen)?'daylight':'quiet';
  document.body.dataset.view=state.screen==='results'?(previousView==='doctor'||previousView==='report'?'report':'cover'):state.screen;
  document.body.classList.toggle('show-results',['results','doctor'].includes(state.screen));
  // Авторская ссылка доступна только до заполнения и после завершения.
  document.getElementById('site-footer').hidden=!['welcome','results'].includes(state.screen);
  document.querySelector('.nature').classList.toggle('celebrate',state.screen==='results');
  const template=document.createElement('template');template.innerHTML=screenMarkup();
  if(stage.firstElementChild||state.screen!=='welcome')template.content.querySelector('.screen').classList.add('settled');
  if(append)stage.append(template.content);else stage.replaceChildren(template.content);
  syncPhoneDock();updateJourney();
  if(state.screen==='question')stabilizeQuestion();
  if(state.screen==='results')animateResults();
  syncBloomStory();syncProgressBranch();conservatory.sync();
  if(focus)announceScreen();

function animateFlow(element,keyframes,options){
  if(reduce()||document.hidden||typeof element.animate!=='function')return Promise.resolve();
  const animation=element.animate(keyframes,{easing:MOTION.easing,fill:'both',...options});transitionAnimations.add(animation);
  return animation.finished.catch(()=>{});
}
function updateJourney(){
 let position=0;
 if(state.screen==='results')position=totalQuestions;
 else if(state.screen==='question'||state.screen==='breath'){
  position=scales.slice(0,state.scale).reduce((sum,q)=>sum+q.questions.length,0);
  if(state.screen==='question')position+=state.item+(Number.isInteger(state.answers[scales[state.scale].id][state.item])?1:0);
 }
 const progress=Math.min(1,Math.max(0,position/totalQuestions));
 root.style.setProperty('--journey-scale',String(1+progress*.065));
 root.style.setProperty('--journey-shift',(-progress*2.6)+'%');
 root.style.setProperty('--journey-light',String(.24+progress*.12));
}
function revealQuestionTop(card){
 const top=card.getBoundingClientRect().top;
 if(top < -56&&!reduce())window.scrollTo({top:Math.max(0,window.scrollY+top-22),behavior:'smooth'});
}
async function morphQuestion(card,direction){
 const outgoing=card.querySelector('.question-content');
 const template=document.createElement('template');template.innerHTML=question();
 const incoming=template.content.querySelector('.question-content');
 incoming.querySelectorAll('.answer').forEach(answer=>answer.classList.add('settled'));
 outgoing.inert=true;outgoing.setAttribute('aria-hidden','true');incoming.inert=true;
 card.classList.remove('has-answer','shake');card.classList.add('question-morph');card.append(incoming);
 if(Number.isInteger(state.answers[scales[state.scale].id][state.item]))card.classList.add('has-answer');
 updateJourney();revealQuestionTop(card);
 try{
  const entrance=[{opacity:0},{opacity:1}];
  await Promise.all([
   animateFlow(outgoing,[{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(0,${-direction*6}px,0)`}],{duration:MOTION.out,easing:'cubic-bezier(.4,0,.6,1)'}),
   animateFlow(incoming,entrance,{duration:MOTION.in,delay:MOTION.overlap}),
   animateFlow(incoming.querySelector('h2'),[{transform:`translate3d(0,${direction*7}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap}),
   ...[...incoming.querySelectorAll('.answer')].map((answer,i)=>animateFlow(answer,[{opacity:0,transform:`translate3d(0,${direction*8}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.answer,delay:MOTION.overlap+130+i*MOTION.stagger}))
  ]);
 }finally{outgoing.remove();incoming.inert=false;card.classList.remove('question-morph');announceScreen()}
}
async function navigate(change,direction=1){
  if(state.busy)return;state.busy=true;syncPhoneDock();stage.setAttribute('aria-busy','true');stage.classList.add('flow-transition');
  const previousScreen=state.screen,outgoing=stage.lastElementChild,card=outgoing?.querySelector('.question');
  try{
    // Быстрый «Далее» не обрывает заливку, галочку и мягкую реакцию выбора.
    if(direction>0&&!reduce()&&!document.hidden){
      const now=performance.now(),answerHold=previousScreen==='question'?MOTION.feedbackHold-(now-lastSelectionAt):0;
      const remaining=Math.max(answerHold,MOTION.pressHold-(now-lastActionGlowAt));
      if(remaining>0)await delay(remaining);
    }
    change();syncPhoneDock();
    if(reduce()||document.hidden){render();if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'instant'});return}
    if(previousScreen==='question'&&state.screen==='question'&&card){await morphQuestion(card,direction);return}
    render(false,true);const incoming=stage.lastElementChild;
    if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'smooth'});
    if(outgoing){outgoing.inert=true;outgoing.setAttribute('aria-hidden','true')}
    incoming.inert=true;
    try{
      await Promise.all([
        outgoing?animateFlow(outgoing,[{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(0,${-direction*7}px,0)`}],{duration:MOTION.out}):Promise.resolve(),
        animateFlow(incoming,[{opacity:0,transform:`translate3d(0,${direction*9}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap})
      ]);
    }finally{outgoing?.remove();incoming.inert=false;syncBloomStory();syncProgressBranch();conservatory.sync();announceScreen()}
    if(window.scrollY>stage.offsetTop+180)stage.scrollIntoView({block:'start',behavior:'smooth'});
  }finally{transitionAnimations.forEach(animation=>animation.cancel());transitionAnimations.clear();stage.classList.remove('flow-transition');stage.removeAttribute('aria-busy');state.busy=false;syncPhoneDock()}
}
function next(){
  const q=scales[state.scale];
  if(!Number.isInteger(state.answers[q.id][state.item])){
    const card=stage.querySelector('.question');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');document.getElementById('answer-hint').textContent='Выберите, пожалуйста, один вариант ответа.';return;
  }
  illuminateAdvance(phoneLayout.matches?document.querySelector('#phone-dock [data-action="next"]'):stage.querySelector('[data-action="next"]'));
  navigate(()=>{if(state.item<q.questions.length-1)state.item++;else if(state.scale<scales.length-1){state.scale++;state.item=0;state.screen='breath'}else{state.screen='results';state.completedAt=new Date()}});
}
function back(){
  navigate(()=>{
    if(state.screen==='question'){if(state.item>0)state.item--;else state.screen='breath'}
    else if(state.screen==='breath'){if(state.scale>0){state.scale--;state.item=scales[state.scale].questions.length-1;state.screen='question'}else state.screen='profile'}
  },-1);
}
function choose(index){
  if(state.busy||state.screen!=='question')return;
  const q=scales[state.scale];if(!q.questions[state.item].options[index])return;
  state.answers[q.id][state.item]=index;lastSelectionAt=performance.now();
  stage.querySelectorAll('[data-answer]').forEach(button=>{const checked=Number(button.dataset.answer)===index;button.setAttribute('aria-checked',String(checked));button.tabIndex=checked?0:-1;});
  const card=stage.querySelector('.question');card.classList.remove('shake','has-answer');void card.offsetWidth;card.classList.add('has-answer');document.getElementById('answer-hint').textContent='';updateProgress();syncPhoneDock();updateJourney();
}

function reportDate(){return (state.completedAt||new Date()).toLocaleString('ru-RU',{dateStyle:'long',timeStyle:'short',timeZone:'Europe/Moscow'})+' МСК'}
function reportText(){return ['ГОЛОСА ПАЛАТЫ · Результаты скрининговых опросников','Telegram: https://t.me/MUESLIMEDICA',reportDate(),profileSummary(),QUESTIONNAIRES.asrs5.scoringNote,QUESTIONNAIRES.hcl8.scoringNote,isDemo()?'ПРЕДПРОСМОТР. Неподтверждённые бланки не используются для расчёта.':'',...results().map(r=>`${r.scale}${r.scale==='HADS'?' · '+r.title:''}: ${r.available?formatScore(r.total)+' / '+formatScore(r.max)+' баллов':'не рассчитано'}. ${r.message}.`),'','СВОДКА ДЛЯ ВРАЧА-ПСИХИАТРА',buildClinicianSummary(results(),state.profile),'','Результаты не являются диагнозом. Диагноз устанавливает врач при клиническом интервью. Результат ниже порога не исключает расстройства. BIS-brief не имеет единого диагностического порога.'].filter((line,i)=>line||i>1).join('\n')}
function emailHref(){return `mailto:${DOCTOR_EMAIL}?subject=${encodeURIComponent('Результаты опросников перед приёмом')}&body=${encodeURIComponent(reportText())}`}
function toast(message){clearTimeout(toastTimer);const node=document.getElementById('toast');node.textContent=message;node.classList.add('visible');toastTimer=setTimeout(()=>node.classList.remove('visible'),3500)}
async function copyResults(text=reportText()){

function reset(){seenFlowers.clear();branchBirths.clear();stopBotanicMotions();state.resume=null;scales.forEach(q=>state.answers[q.id].fill(null));state.scale=0;state.item=0;state.screen='welcome';state.profile={sex:'',age:''};state.completedAt=null;}

function animateResults(){
  const data=results(),pending=new Set();
  function run(card){card.classList.remove('is-pending');card.classList.add('is-revealed');const index=Number(card.dataset.result),r=data[index];if(!r.available)return;const fraction=Math.max(0,Math.min(1,r.total/r.max));card.querySelector('.ring-value').style.transitionDelay=`${index*120}ms`;card.querySelector('.bar-fill').style.transitionDelay=`${index*120}ms`;card.querySelector('.ring-value').style.strokeDashoffset=100-fraction*100;card.querySelector('.bar-fill').style.transform=`scaleX(${fraction})`;if(reduce()){card.querySelector('.counter').textContent=formatScore(r.total);return}const start=performance.now()+index*120;pending.add({card,r,start});if(!renderFrame)renderFrame=requestAnimationFrame(tick);}
  function tick(now){renderFrame=0;for(const item of pending){if(!item.card.isConnected){pending.delete(item);continue}const t=Math.max(0,Math.min(1,(now-item.start)/1200)),eased=1-Math.pow(1-t,3);item.card.querySelector('.counter').textContent=formatScore(item.r.total*eased,item.r.decimals);if(t===1)pending.delete(item)}if(pending.size)renderFrame=requestAnimationFrame(tick);}
  if('IntersectionObserver' in window){resultObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){run(entry.target);resultObserver.unobserve(entry.target)}}),{threshold:.2});stage.querySelectorAll('.result-card').forEach(card=>{if(!reduce())card.classList.add('is-pending');resultObserver.observe(card)});}
  else stage.querySelectorAll('.result-card').forEach(run);
}
function finishResultAnimations(){if(state.screen!=='results')return;cancelAnimationFrame(renderFrame);renderFrame=0;results().forEach((r,i)=>{const card=stage.querySelector(`[data-result="${i}"]`);if(!card)return;card.classList.remove('is-pending');card.classList.add('is-revealed');if(!r.available)return;card.querySelector('.counter').textContent=formatScore(r.total);card.querySelector('.ring-value').style.strokeDashoffset=100-r.total/r.max*100;card.querySelector('.bar-fill').style.transform=`scaleX(${r.total/r.max})`;});resultObserver?.disconnect();}
function ripple(event){if(reduce())return;const button=event.target.closest('.button,.motion');if(!button)return;const box=button.getBoundingClientRect(),node=document.createElement('span');node.className='ripple';node.setAttribute('aria-hidden','true');node.style.setProperty('--diameter',Math.max(box.width,box.height)*2+'px');node.style.setProperty('--rx',(event.detail?event.clientX-box.left:box.width/2)+'px');node.style.setProperty('--ry',(event.detail?event.clientY-box.top:box.height/2)+'px');button.append(node);setTimeout(()=>node.remove(),750);}
const pollen=document.getElementById('pollen');for(let i=0;i<16;i++){const p=document.createElement('i');p.className='particle';p.style.cssText=`--x:${(i*6.7+3)%100}%;--size:${2+i%3}px;--duration:${22+i%5*3}s;--delay:${-i*3.2}s`;pollen.append(p)}
let px=0,py=0,tx=0,ty=0,parallaxFrame=0;
const layers=[...document.querySelectorAll('[data-depth]')];
function parallaxTick(){parallaxFrame=0;if(reduce()||document.hidden)return;px+=(tx-px)*.025;py+=(ty-py)*.025;layers.forEach(layer=>{const d=Number(layer.dataset.depth);layer.style.transform=`translate3d(${px*d}px,${py*d}px,0)`});if(Math.abs(tx-px)+Math.abs(ty-py)>.002)parallaxFrame=requestAnimationFrame(parallaxTick);}
function parallax(){if(!parallaxFrame&&!reduce()&&!document.hidden)parallaxFrame=requestAnimationFrame(parallaxTick)}
window.addEventListener('pointermove',event=>{if(!pointerFine.matches||reduce())return;tx=(event.clientX/innerWidth-.5)*.45;ty=(event.clientY/innerHeight-.5)*.45;parallax();const main=event.target.closest('.magnetic');if(main){const box=main.getBoundingClientRect();main.style.transform=`translate(${(event.clientX-box.left-box.width/2)*.07}px,${(event.clientY-box.top-box.height/2)*.1}px)`;}},{passive:true});
document.addEventListener('pointerout',event=>{const button=event.target.closest('.magnetic');if(button&&!button.contains(event.relatedTarget))button.style.transform='';},{passive:true});
window.addEventListener('scroll',()=>{if(pointerFine.matches||reduce())return;tx=0;ty=Math.min(.45,scrollY/1800);parallax();},{passive:true});
function applyMotion(){controlBotanicalMotion();root.classList.toggle('calm',calm);conservatory.sync();const effective=reduce(),button=document.getElementById('motion');button.setAttribute('aria-pressed',String(effective));button.setAttribute('aria-label',effective?'Движение уменьшено':'Уменьшить движение');button.title=effective?'Движение уменьшено':'Уменьшить движение';if(effective){transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;px=py=tx=ty=0;layers.forEach(layer=>layer.style.transform='');document.querySelector('.magnetic')?.style.removeProperty('transform');finishResultAnimations();}}

  }
  function stop(){clearTimeout(timer);cancelAnimationFrame(frame);frame=timer=previous=0;}
  function active(){return loaded&&observing&&!broken&&!reduce()&&!document.hidden;}
  function schedule(){
    if(!active()){stop();return;}
    if(!frame&&!timer)frame=requestAnimationFrame(draw);
  }
  function draw(now){
    frame=0;if(!active())return;
    if(previous)clock+=Math.min(200,now-previous)/1000;previous=now;
    const wave=(period,phase)=>Math.sin(2*Math.PI*clock/period+phase);
    const strength=room.strength,far=wave(27,.4),middle=wave(19.4,1.6),near=wave(15.7,-.7);
    viewpoint+=(aim-viewpoint)*.08;
    gl.uniform4fv(uniforms.crop,crop);
    gl.uniform3f(uniforms.wind,far*strength,middle*strength,near*strength);
    gl.uniform1f(uniforms.viewpoint,viewpoint*strength);gl.uniform1f(uniforms.strength,strength);
    gl.uniform3f(uniforms.lighting,wave(37,.8),wave(31,-.5),wave(22.5,.24));
    gl.uniform2f(uniforms.shadowDrift,.011*(far*.42+middle*.58),.006*(middle*.68+near*.32));
    gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_SHORT,0);canvas.classList.add('ready');
    timer=setTimeout(()=>{timer=0;schedule();},room===rooms.quiet?72:38);
  }
  function fail(){broken=true;loaded=false;stop();canvas.remove();resize?.disconnect();intersection?.disconnect();}
  async function sync(){
    const next=rooms[document.body.dataset.room];
    const target=next&&(next===rooms.entry?stage.querySelector('.screen:last-child .entry-photo'):document.querySelector(next.element));
    if(reduce()){generation++;loaded=false;host=null;stop();resize?.disconnect();intersection?.disconnect();canvas.remove();return;}
    if(!target||broken)return;
    if(target===host){schedule();return;}
    stop();loaded=false;room=next;host=target;observing=true;
    const version=++generation;
    canvas.classList.remove('ready');target.append(canvas);resize?.disconnect();resize?.observe(target);intersection?.disconnect();intersection?.observe(target);
    try{
      if(!gl)init();
      const url=getComputedStyle(document.documentElement).getPropertyValue(next.photo).trim().replace(/^url\(["']?|["']?\)$/g,'');
      const [photo,light]=await Promise.all([picture(url),picture(next.light)]);
      if(version!==generation||reduce())return;
      upload(photo,0);upload(light,1);aspect=photo.naturalWidth/photo.naturalHeight;
      gl.uniform4fv(uniforms['fields[0]'],next.fields.flatMap(f=>f.slice(0,4)));
      gl.uniform2fv(uniforms['anchors[0]'],next.fields.flatMap(f=>f.slice(4)));
      loaded=true;measure();
    }catch{if(version===generation)fail();}
  }
  canvas.addEventListener('webglcontextlost',fail);
  window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!reduce())aim=(e.clientX/innerWidth-.5)*2;},{passive:true});
  if(!resize)window.addEventListener('resize',measure,{passive:true});
  document.addEventListener('visibilitychange',schedule);
  return {sync};
}
const conservatory=createConservatory();

systemMotion.addEventListener('change',applyMotion);
document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden);controlBotanicalMotion();if(document.hidden){transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;finishResultAnimations()}else parallax();});
window.addEventListener('beforeprint',()=>{finishResultAnimations()});
// ==================== СОБЫТИЯ И ДОСТУПНОСТЬ ====================
document.addEventListener('click',event=>{
  if(event.target.closest('a[data-action]'))event.preventDefault();
  if(event.target.closest('#motion')){calm=!calm;applyMotion();toast(systemMotion.matches?'В системе включено уменьшение движения':calm?'Спокойный режим включён':'Анимации включены');return;}
  if(state.busy)return;ripple(event);
  const answer=event.target.closest('[data-answer]');if(answer){choose(Number(answer.dataset.answer));return;}
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='start')beginOrResume();
  if(action==='home')goHome();
  if(action==='doctor'&&state.completedAt)navigate(()=>{state.screen='doctor'});
  if(action==='results'&&state.completedAt)navigate(()=>{state.screen='results'},-1);
  if(action==='copy-doctor')copyResults(doctorReportText());
  if(action==='profile-back')navigate(()=>{state.screen='welcome'},-1);
  if(action==='continue'){if(Object.keys(validateProfile(state.profile)).length){navigate(()=>{state.screen='profile'});return}illuminateAdvance(event.target.closest('[data-action="continue"]'));navigate(()=>{state.screen='question';state.item=0})}
  if(action==='next')next();if(action==='back')back();if(action==='copy')copyResults();
  if(action==='print'){finishResultAnimations();window.print();}
  if(action==='restart'){document.getElementById('restart-confirm').hidden=false;stage.querySelector('[data-action="cancel-restart"]').focus();}
  if(action==='cancel-restart'){document.getElementById('restart-confirm').hidden=true;stage.querySelector('[data-action="restart"]').focus();}
  if(action==='confirm-restart')navigate(reset,-1);
});
stage.addEventListener('submit',event=>{if(event.target.id==='profile-form')submitProfile(event)});
stage.addEventListener('input',event=>{
  if(state.screen!=='profile')return;
  if(event.target.name==='age')state.profile.age=event.target.value;
  if(event.target.name==='sex')state.profile.sex=event.target.value;
});
stage.addEventListener('keydown',event=>{
  if(state.screen!=='question'||state.busy||event.altKey||event.ctrlKey||event.metaKey)return;
  const options=[...stage.querySelectorAll('[data-answer]')],focused=event.target.closest('[data-answer]'),q=scales[state.scale];
  if(/^[1-5]$/.test(event.key)){const index=Number(event.key)-1;if(options[index]){event.preventDefault();choose(index);options[index].focus();}return;}
  if(focused&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)){
    event.preventDefault();let i=Number(focused.dataset.answer);i=event.key==='Home'?0:event.key==='End'?options.length-1:(i+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+options.length)%options.length;choose(i);options[i].focus();
  }
  // Enter на варианте выбирает его (нативный click); повторный Enter идёт далее.
  if(event.key==='Enter'&&focused&&state.answers[q.id][state.item]===Number(focused.dataset.answer)){event.preventDefault();next();}
  else if(event.key==='Enter'&&event.target.id==='screen-title'){event.preventDefault();next();}
});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.screen==='question'&&!state.busy)stabilizeQuestion()},180)},{passive:true});
document.fonts?.addEventListener('loadingdone',()=>{questionHeightCache.clear();if(state.screen==='question'&&!state.busy)stabilizeQuestion()});
// Молодой лист раскрывается только при первом посещении главного экрана.
if(reduce())root.classList.add('garden-established');
document.addEventListener('animationend',event=>{if(event.animationName==='young-leaf-unfurl')root.classList.add('garden-established')});
applyMotion();render(false);
})();
