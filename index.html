<style>

.nature{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;isolation:isolate;animation:fade-in 1.6s both;contain:strict}.sky{position:absolute;inset:-20%;background:radial-gradient(ellipse at 65% 22%,#F9F9D4 0,transparent 40%),radial-gradient(ellipse at 7% 80%,#8FCAA6 0,transparent 45%),linear-gradient(130deg,#D9EFE1,#F2FAF5 55%,#BDDDC6);animation:sky var(--t-ambient) ease-in-out infinite alternate}.rays{position:absolute;inset:-40%;background:repeating-linear-gradient(119deg,transparent 0 10%,#fff9 11%,transparent 14% 29%);opacity:.18;filter:blur(8px);transform:rotate(-8deg);animation:light 32s ease-in-out infinite alternate}.layer{position:absolute;inset:0;contain:layout style}.layer>svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:grow 1.8s var(--ease-out) both}.far{opacity:.18;filter:blur(5px)}.mid{opacity:.26}.near{opacity:.65}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 11s ease-in-out infinite alternate}.sway.second{animation-duration:14s;animation-delay:-5s}.sway.third{animation-duration:9s;animation-delay:-8s}.pollen{position:absolute;inset:0}.particle{position:absolute;left:var(--x);bottom:-20px;width:var(--size);height:var(--size);border-radius:50%;background:#D8E86B;filter:blur(1px);opacity:0;animation:float var(--duration) linear var(--delay) infinite}.nature.celebrate .particle{background:#fff6ab;box-shadow:0 0 12px #D8E86B}.paused .nature *,.paused .sway{animation-play-state:paused!important}

.progress{max-width:720px;margin:0 auto 25px}.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:15px}.vine{width:100%;height:38px;overflow:visible}.vine-track{fill:none;stroke:#1F6B4A1C;stroke-width:2}.vine-line{fill:none;stroke:var(--forest);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 950ms var(--ease-out)}.vine-leaf{fill:var(--forest);opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:opacity var(--t-base),transform 700ms var(--ease-spring)}.vine-leaf.open{opacity:.75;transform:scale(1)}.vine-flower{fill:var(--lime);stroke:var(--forest);stroke-width:.8;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform 800ms var(--ease-spring)}.vine-flower.open{transform:scale(1)}

20px}.hint{font-size:12px;min-height:19px;color:#79521D;margin-top:14px}.has-answer .next{animation:ready 550ms var(--ease-out)}.shake{animation:shake 400ms ease-in-out!important}.demo-tag{display:inline-block;padding:5px 8px;border:1px solid #79521D30;border-radius:7px;font-size:9px;letter-spacing:.05em;color:#79521D;background:#FAF1DC;margin-bottom:15px}.breath{text-align:center;padding-top:34px;padding-bottom:34px}.plant-icon{width:100px;height:115px;margin:0 auto 16px;overflow:visible;transform-origin:50% 100%;animation:bloom 1.1s var(--ease-spring) both}.breath .eyebrow{justify-content:center}.breath h2{animation:reveal 850ms var(--ease-out) both}.breath-description{font-size:14px;color:var(--muted);margin:15px auto;max-width:460px}.instruction{font-size:12px;line-height:1.8;max-width:480px;margin:20px auto 25px;padding:18px;border-radius:16px;background:#ECF5EA}.breath .notice{text-align:left;margin-bottom:20px}.breath .navigation{margin-top:25px}.ripple{position:absolute;z-index:1;pointer-events:none;width:var(--diameter);height:var(--diameter);left:var(--rx);top:var(--ry);border-radius:50%;background:#BFE8D04D;transform:translate(-50%,-50%) scale(0);animation:ripple 700ms var(--ease-out) forwards}.petal{position:absolute;pointer-events:none;width:5px;height:9px;left:50%;top:50%;border-radius:70% 0 70% 0;background:var(--grass);z-index:2;animation:petal 650ms var(--ease-out) forwards}
/* Результаты: карточки, кольца и полосы */
.results{max-width:900px;margin:auto}.result-heading{text-align:center;margin-bottom:30px}.result-heading .eyebrow{justify-content:center}.result-heading p{font-size:13px;color:var(--muted);margin:15px auto 0;max-width:510px}.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result-card{padding:24px;display:grid;grid-template-columns:74px 1fr;gap:19px;align-items:center;animation:fade-up 750ms var(--ease-out) both;animation-delay:calc(var(--i)*90ms)}.result-card.warm{--result-color:var(--amber);background:#FFF9ECC7}.result-card{--result-color:var(--forest)}.ring{position:relative;width:74px;height:74px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring-track{fill:none;stroke:#1F6B4A15;stroke-width:4}.ring-value{fill:none;stroke:var(--result-color);stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.2s var(--ease-out)}.ring-number{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:25px;letter-spacing:-1px;color:var(--result-color)}.ring-number small{font-size:9px;letter-spacing:0;color:var(--muted);margin-top:1px}.result-card h3{font-size:13px}.result-card .metric{font-size:10px;color:var(--muted);margin-top:3px}.interpretation{font-size:11px;line-height:1.65;color:var(--result-color);margin-top:9px}.bar{height:3px;background:#1F6B4A13;border-radius:3px;overflow:hidden;margin-top:13px}.bar-fill{height:100%;background:var(--result-color);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease-out)}.unavailable .ring-track{stroke-dasharray:2 4}.unavailable .ring-number{font-size:24px}.result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}.result-actions .button{font-size:11px;gap:10px;padding:13px 21px;min-height:49px}.result-note{margin:24px auto 0;text-align:center;max-width:670px;font-size:11px;color:var(--muted);line-height:1.8}.restart{text-align:center;margin-top:18px}.restart-confi /* Пол и возраст: обязательный шаг перед взрослыми опросниками. */
.profile-card{max-width:720px;margin:auto;padding:clamp(24px,5vw,48px)}
.profile-description{font-size:14px;color:var(--muted);margin:16px 0 26px;max-width:490px}
.profile-sex{border:0;margin:0;padding:0;min-width:0}
.profile-sex legend,.age-label{font-size:13px;font-weight:600;margin-bottom:12px;display:block}
.profile-sex-options{display:flex;flex-wrap:wrap;gap:10px}
.profile-choice{position:relative;cursor:pointer;flex:1;min-width:130px}
.profile-choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.profile-choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:14px;border:1px solid #22553C40;border-radius:16px;background:#fff8;font-size:12px;line-height:1.5;transition:background var(--t-base),border-color var(--t-base)}
.profile-choice input:checked+span{background:linear-gradient(110deg,#CDEBD8,#E8F2CE);border-color:var(--forest)}
.profile-choice input:focus-visible+span{outline:3px solid var(--forest);outline-offset:4px}
.age-input{width:100%;max-width:240px;min-height:54px;border:1px solid #22553C50;border-radius:16px;background:#fff9;color:var(--ink);padding:14px 18px;font:16px Inter,Arial,sans-serif}
.age-input:focus-visible{outline:3px solid var(--forest);outline-offset:4px}
.age-input[aria-invalid=true]{border-color:var(--amber)}
.field-error{min-height:20px;color:var(--amber);font-size:12px;line-height:1.6;margin:8px 0 15px}
.profile-rule{font-size:11px;color:var(--muted);background:#ECF5EA;padding:15px;border-radius:14px;line-height:1.8}
.result-heading .profile-summary{font-size:12px;margin-top:12px}
@media(max-width:420px){.profile-choice{min-width:100%;}.age-input{max-width:none}.profile-card{padding:25px 21px}}
@media print{.profile-card{display:none!important}.result-heading .profile-summary{font-size:9pt;margin-top:3mm}}
/* Блики жидкого стекла и спокойная реакция на выбор. */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.52) 55%,rgba(242,250,245,.72));-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border-color:rgba(255,255,255,.92);box-shadow:0 25px 70px #154A2E0D,0 5px 18px #154A2E09,inset 0 1px 0 #fff,inset 0 -1px 0 #ffffff80}
.choice-echo{position:absolute;right:20px;top:12px;font-size:21px;line-height:1;pointer-events:none;z-index:3;animation:choice-echo 850ms var(--ease-out) both}
@keyframes choice-echo{0%{opacity:0;transform:translateY(8px) scale(.6) rotate(-12deg)}25%{opacity:.9;transform:translateY(-4px) scale(1.12) rotate(4deg)}100%{opacity:0;transform:translateY(-34px) scale(.8) rotate(12deg)}}
.doctor-summary{margin-top:22px;padding:24px;border-radius:20px}
.doctor-summary h3{font-size:14px;margin-bottom:14px}
.doctor-summary-text{white-space:pre-line;font-size:12px;line-height:1.8;color:var(--muted)}
html.calm .choice-echo{display:none}
@media(prefers-reduced-motion:reduce){.choice-echo{display:none}}
@media print{.doctor-summary{padding:3mm;margin-top:4mm;break-inside:avoid}.doctor-summary h3{font-size:9pt;margin-bottom:2mm}.doctor-summary-text{font-size:7.5pt;line-height:1.4}.doctor-summary-text{white-space:pre-line}.result-card{padding:3mm}.result-note{margin-top:3mm;font-size:7pt}.choice-echo{display:none}}
/* Движение. Прорисовка SVG — осознанное исключение из transform/opacity. */

// ==================== ПОДСЧЁТ: чистые функции, без DOM ====================
function readiness(q){
  if(!q.verifiedText || q.questions.some(item=>/\[ВСТАВИТЬ/.test(item.text)||item.options.some(o=>/\[ВСТАВИТЬ/.test(o.label)))) return 'Официальный бланк ещё не добавлен';
  if(!q.verifiedKey || !Array.isArray(q.reverseItems) || q.questions.some(item=>item.options.some(o=>!Number.isFinite(o.points)))) return 'Ключ требует проверки';
  if(!Number.isFinite(q.min)||!Number.isFinite(q.max)) return 'Диапазон требует проверки';
  if(q.scoringMode!=='sumOnly' && (!Array.isArray(q.thresholds)||!q.thresholds.length)) return 'Порог требует проверки';
  return '';
}
function valuesFor(q,answers){
  if(!Array.isArray(answers)||answers.length!==q.questions.length) return null;
  const values=q.questions.map((item,i)=>{
    const answer=answers[i];
    if(!Number.isInteger(answer)||answer<0||answer>=item.options.length) return NaN;
    const value=item.options[answer].points;
    if(!Number.isFinite(value)) return NaN;
    return q.reverseItems.includes(i+1)?q.reverseBounds[0]+q.reverseBounds[1]-value:value;
  });
  return values.every(Number.isFinite)?values:null;
}
function metric(q,title,total,min,max){
  total=Math.round((total+Number.EPSILON)*100)/100;
  const band=q.thresholds?.find(b=>total>=b.min&&total<=b.max),sumOnly=q.scoringMode==='sumOnly';
  if(total<min||total>max||(!band&&!sumOnly)) return {scale:q.name,title,total:null,min,max,available:false,message:'Проверьте диапазон и пороги'};
  return {scale:q.name,title,total,min,max,available:true,decimals:q.decimals||0,high:!sumOnly&&total>q.thresholds[0].max,message:sumOnly?q.interpretations.sum:band.label};
}
function compute(q,answers){
  const reason=readiness(q), values=reason?null:valuesFor(q,answers);
  const unavailable=title=>({scale:q.name,title,total:null,min:q.min,max:q.max,available:false,message:reason||'Ответы заполнены не полностью'});
  if(q.subscales.length) return q.subscales.map(s=>values?metric(q,s.name,s.items.reduce((sum,n)=>sum+values[n-1],0),q.min,q.max):unavailable(s.name));
  return [values?metric(q,q.description,values.reduce((a,b)=>a+b,0),q.min,q.max):unavailable(q.description)];
}
function scoreHADS(answers,q=QUESTIONNAIRES.hads){return compute(q,answers)}
function scoreAQ10(answers,q=QUESTIONNAIRES.aq10){return compute(q,answers)[0]}
function scoreASRS5(answers,q=QUESTIONNAIRES.asrs5){return compute(q,answers)[0]}
function scoreBISBrief(answers,q=QUESTIONNAIRES.bis){return compute(q,answers)[0]}
function scoreHCL8(answers,q=QUESTIONNAIRES.hcl8){return compute(q,answers)[0]}

function selectionPlan(scaleId,itemIndex,sequence){
  const modes={hads:'fall',aq10:'wind',asrs5:'orbit',bis:'water',hcl8:'bloom'};
  return {mode:modes[scaleId]||'fall',variant:(itemIndex+sequence)%3,count:5,duration:1120};
}
function selectionKeyframes(mode,index,variant){
  const angle=index/5*Math.PI*2,side=variant===1?-1:1;
  let middle,end,rotation;
  if(mode==='fall'){
    middle=[Math.sin(index*1.7+variant)*23,38+index*5];end=[Math.sin(index*2.2+variant)*35,85+index*10];rotation=90+index*38;
  }else if(mode==='wind'){
    middle=[side*(38+index*9),-18+Math.sin(index+variant)*18];end=[side*(95+index*12),-50+index*17];rotation=side*(110+index*24);
  }else if(mode==='orbit'){
    middle=[Math.cos(angle+variant)*31,Math.sin(angle+variant)*20-10];end=[Math.cos(angle+variant+.8)*65,Math.sin(angle+variant+.8)*44-38];rotation=side*(100+index*35);
  }else if(mode==='bloom'){
    middle=[Math.cos(angle)*25,Math.sin(angle)*20-9];end=[Math.cos(angle)*52,Math.sin(angle)*40-30];rotation=index*65+variant*30;
  }else{
    return [{opacity:0,transform:'translate3d(0,0,0) scale(.35)'},{offset:.2,opacity:.35,transform:'translate3d(0,0,0) scale(.85)'},{opacity:0,transform:`translate3d(0,${index*2}px,0) scale(${2.2+index*.18})`}];
  }
  return [
    {opacity:0,transform:`translate3d(0,0,0) rotate(${-20+index*13}deg) scale(.55)`},
    {offset:.2,opacity:.6,transform:`translate3d(${middle[0]*.3}px,${middle[1]*.3}px,0) rotate(${rotation*.12}deg) scale(.9)`},
    {offset:.58,opacity:.42,transform:`translate3d(${middle[0]}px,${middle[1]}px,0) rotate(${rotation*.55}deg) scale(1)`},
    {opacity:0,transform:`translate3d(${end[0]}px,${end[1]}px,0) rotate(${rotation}deg) scale(.7)`}
  ];
}

// Сводка для врача описывает только результаты самоотчёта, без нового диагноза.
function buildClinicianSummary(rows,profile){
  const number=value=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value);
  const sex={male:'мужской',female:'женский',unspecified:'не указан'}[profile.sex]||'не указан';
  const lines=[`Скрининговое обследование по данным самоотчёта. Возраст: ${profile.age||'не указан'}; пол: ${sex}.`];
  const hads=rows.filter(r=>r.scale==='HADS');
  if(hads.length===2&&hads.every(r=>r.available)){
    const grade=value=>value<8?'ниже скринингового порога':value<11?'субклиническая выраженность симптомов по шкале':'клиническая выраженность симптомов по шкале';
    lines.push(`HADS-A: ${number(hads[0].total)}/21, ${grade(hads[0].total)}. HADS-D: ${number(hads[1].total)}/21, ${grade(hads[1].total)}.`);
  }
  for(const row of rows){
    if(row.scale==='HADS')continue;
    if(!row.available){lines.push(`${row.scale}: результат недоступен; ${row.message}.`);continue}
    const value=`${number(row.total)}/${number(row.max)}`;
    if(row.scale==='AQ-10')lines.push(`AQ-10: ${value}; скрининговый порог ${row.high?'достигнут':'не достигнут'}.`);
    if(row.scale==='ASRS-5')lines.push(`ASRS-5: ${value}, простая сумма ответов. Пороговая интерпретация не проводилась: взвешенный ключ в этой версии не используется.`);
    if(row.scale==='BIS-brief')lines.push(`BIS-brief: ${value}; сумма баллов, без диагностической категоризации.`);
    if(row.scale==='HCL-8')lines.push(`HCL-8: ${value}, взвешенная русская версия; порог 9,3 ${row.high?'достигнут':'не достигнут'}.`);
  }
  const directions=[];
  if(hads.some(r=>r.available&&r.high))directions.push('выраженность и длительность тревожных и депрессивных симптомов');
  if(rows.some(r=>r.scale==='AQ-10'&&r.available&&r.high))directions.push('анамнез развития и особенности социальной коммуникации');
  if(rows.some(r=>r.scale==='HCL-8'&&r.available&&r.high))directions.push('наличие, продолжительность и последствия периодов подъёма настроения и активности');
  if(directions.length)lines.push(`При клиническом интервью целесообразно уточнить: ${directions.join('; ')}.`);
  lines.push('Результаты скрининга не являются диагнозом и не позволяют установить или исключить расстройство без клинической оценки.');
  return lines.join('\n\n');
}

// Возраст проверяет применимость набора 18+; пол включается в отчёт врачу.
function validateProfile(profile){
  const errors={};
  if(!['male','female','unspecified'].includes(profile.sex))errors.sex='Укажите пол или выберите «Не хочу указывать».';
  const raw=String(profile.age??'').trim(),age=Number(raw);
  if(!/^\d{1,3}$/.test(raw)||!Number.isInteger(age)||age<1||age>120)errors.age='Введите возраст целым числом от 1 до 120 лет.';
  else if(age<18)errors.age='Этот набор опросников предназначен для взрослых от 18 лет. Для вашего возраста нужен другой набор.';
  return errors;
}

function franklQuote(){return `<figure class="frankl-quote glass"><span class="quote-light" aria-hidden="true"></span><blockquote><p>«Когда мы не можем изменить ситуацию, <span class="quote-emphasis">мы вынуждены изменить себя</span>».</p></blockquote><figcaption>Виктор Франкл</figcaption><p class="quote-caption">Бережность к себе начинается с внимания.</p></figure>`}
function careInformation(){return `<details class="important glass"><summary>Важно знать перед началом</summary><p>Пять коротких опросников помогут описать ваше самочувствие с разных сторон. Отвечайте так, как ощущаете: здесь важен ваш опыт, а не «правильный» ответ.</p><dl class="scale-guide"><div><dt>HADS</dt><dd>Тревога и настроение за последнюю неделю.</dd></div><div><dt>AQ-10</dt><dd>Особенности общения, восприятия и привычного поведения.</dd></div><div><dt>ASRS-5</dt><dd>Внимание, организация дел и активность за последние шесть месяцев.</dd></div><div><dt>BIS-brief</dt><dd>Привычный темп решений и склонность действовать импульсивно.</dd></div><div><dt>HCL-8</dt><dd>Периоды необычного подъёма настроения и активности в прошлом.</dd></div></dl><p>Это скрининг для взрослых от 18 лет. Он помогает обозначить темы для разговора; диагноз устанавливает врач в клинической беседе. Возможности каждого опросника зависят от его версии и условий применения.</p><p>Можно делать паузы, возвращаться к ответам и на главный экран. Ответы сохранятся в этой вкладке до её закрытия или обновления. Поделиться результатами можно по собственному решению.</p></details>`}
function comparisonData(rows){return rows.map(r=>{const span=r.max-r.min;const fraction=r.available&&span>0?Math.max(0,Math.min(1,(r.total-r.min)/span)):0;const threshold=r.scale==='HADS'?8:r.scale==='AQ-10'?6:r.scale==='HCL-8'?9.3:null;return {...r,fraction,thresholdFraction:threshold===null?null:(threshold-r.min)/span}})}
function scoreComparison(rows){return `<section class="score-comparison glass" aria-labelledby="comparison-title"><div class="eyebrow">Общая картина</div><h3 id="comparison-title">Ваши баллы на одном графике</h3><p class="comparison-note">У каждой шкалы свой диапазон. Длина полосы показывает положение внутри этого диапазона; баллы разных шкал не складываются и не сравниваются напрямую.</p><ol class="comparison-list">${comparisonData(rows).map(r=>`<li class="comparison-row ${r.high?'warm':''}"><div class="comparison-heading"><span><strong>${esc(r.scale)}</strong>${r.scale==='HADS'?`<small>${esc(r.title)}</small>`:''}</span><b>${r.available?formatScore(r.total):'—'} <small>/ ${formatScore(r.max)}</small></b></div><div class="comparison-rail" aria-hidden="true"><span class="comparison-fill" style="--score:${r.fraction}"></span>${r.thresholdFraction===null?'':`<i class="comparison-threshold" style="left:${r.thresholdFraction*100}%"></i>`}</div><div class="comparison-range"><span>${formatScore(r.min)}</span><span>${r.thresholdFraction===null?'Без пороговой оценки':r.high?'Есть тема для обсуждения с врачом':'Ниже скринингового порога'}</span><span>${formatScore(r.max)}</span></div></li>`).join('')}</ol><p class="comparison-legend"><span aria-hidden="true">│</span> Отметка — скрининговый порог там, где он применяется.</p></section>`}
function clinicalDirections(rows){
 const high=scale=>rows.some(r=>r.scale===scale&&r.available&&r.high);
 return [
  {title:'Тревога и настроение',focus:high('HADS'),text:high('HADS')?'По HADS достигнут скрининговый порог. Уточнить длительность симптомов, сон, динамику и влияние на повседневную жизнь.':'По HADS скрининговый порог не достигнут. При наличии жалоб оценить их длительность и влияние на жизнь независимо от балла.'},
  {title:'Особенности развития и общения',focus:high('AQ-10'),text:high('AQ-10')?'По AQ-10 достигнут скрининговый порог. Уточнить раннее развитие, устойчивость особенностей общения и сенсорного восприятия, их влияние на учёбу, работу и отношения.':'Обсудить особенности общения и восприятия, если они беспокоят пациента. Балл AQ-10 ниже порога сам по себе не исключает трудностей.'},
  {title:'Внимание и организация дел',focus:false,text:'ASRS-5 представлен простой суммой без порогового заключения. Уточнить проявления с детства, ситуации в разных сферах жизни и функциональные последствия; учитывать сон, тревогу и настроение.'},
  {title:'Решения и импульсивность',focus:false,text:'BIS-brief не имеет диагностического порога в этой версии. Оценивать балл вместе с примерами поступков, обстоятельствами и последствиями.'},
  {title:'Периоды подъёма активности',focus:high('HCL-8'),text:high('HCL-8')?'По HCL-8 достигнут скрининговый порог. Уточнить, относились ли признаки к одному периоду, его длительность, потребность во сне, изменение поведения и влияние лекарств или веществ.':'При соответствующем анамнезе уточнить периоды изменения сна, настроения и активности. HCL-8 не заменяет оценку эпизода в интервью.'}
 ];
}

const sexLabels={male:'Мужской',female:'Женский',unspecified:'Не указан'};
function adaptWording(text,sex){
  if(!['male','female'].includes(sex))return text;
  const index=sex==='female'?1:0;
  const forms=[
    ['Я стал (стала) менее застенчивым (застенчивой) и «закомплексованным» («закомплексованной»).','Я стал менее застенчивым и «закомплексованным».','Я стала менее застенчивой и «закомплексованной».'],
    ['отвлекался (отвлекалась)','отвлекался','отвлекалась'],
    ['напуган(а)','напуган','напугана'],['способен(на)','способен','способна'],
    ['жизнерадостный(ная)','жизнерадостный','жизнерадостная'],
    ['замедленным(ой)','замедленным','замедленной'],['стал(а)','стал','стала'],
    ['согласен(на)','согласен','согласна'],['невнимательный(-ая)','невнимательный','невнимательная'],
    ['аккуратен(-на)','аккуратен','аккуратна'],['осторожен(-на)','осторожен','осторожна'],
    ['говорил(а)','говорил','говорила'],['шутил(а)','шутил','шутила'],['каламбурил(а)','каламбурил','каламбурила'],
    ['раздражал(а)','раздражал','раздражала'],['утомлял(а)','утомлял','утомляла'],
    ['энергичным(ой)','энергичным','энергичной'],['активным(ой)','активным','активной'],['приподнятым(ой)','приподнятым','приподнятой']
  ];
  return forms.reduce((value,[original,male,female])=>value.split(original).join(index?female:male),text);
}

function submitProfile(event){
  event.preventDefault();if(state.busy)return;
  const form=event.target;
  state.profile.sex=form.querySelector('input[name="sex"]:checked')?.value||'';
  state.profile.age=form.querySelector('[name="age"]').value.trim();
  const errors=validateProfile(state.profile);
  document.getElementById('sex-error').textContent=errors.sex||'';
  document.getElementById('age-error').textContent=errors.age||'';
  const fieldset=form.querySelector('fieldset'),age=form.querySelector('[name="age"]');
  fieldset.setAttribute('aria-invalid',String(!!errors.sex));
  form.querySelectorAll('input[name="sex"]').forEach(input=>input.setAttribute('aria-invalid',String(!!errors.sex)));
  age.setAttribute('aria-invalid',String(!!errors.age));
  if(errors.sex){form.querySelector('input[name="sex"]').focus();return}
  if(errors.age){age.focus();return}
  state.profile.age=String(Number(state.profile.age));age.blur();
  navigate(()=>{state.screen='breath';state.scale=0;state.item=0});
}

function illuminateAdvance(button){
  if(!button||reduce()||document.hidden)return;
  lastActionGlowAt=performance.now();
  clearTimeout(advanceTimers.get(button));
  if(button.classList.contains('is-flowing')){button.classList.remove('is-flowing');void button.offsetWidth;}
  button.classList.add('is-flowing');
  advanceTimers.set(button,setTimeout(()=>{button.classList.remove('is-flowing');advanceTimers.delete(button)},1100));
}

function stabilizeQuestion(){
  const card=stage.lastElementChild?.querySelector('.question');if(!card)return;
  const width=Math.round(card.getBoundingClientRect().width);if(!width)return;
  const key=scales[state.scale].id+':'+width+':'+(document.fonts?.status||'ready');
  let height=questionHeightCache.get(key);
  if(!height){
    const measure=document.createElement('div');measure.className='question-measure';measure.setAttribute('aria-hidden','true');measure.inert=true;measure.style.width=width+'px';
    const template=document.createElement('template');
    scales[state.scale].questions.forEach((_,i)=>{template.innerHTML=question(i);const clone=template.content.querySelector('.question');clone.style.minHeight='0';measure.append(clone)});
    document.body.append(measure);
    height=Math.ceil(Math.max(...[...measure.children].map(child=>child.getBoundingClientRect().height)));
    measure.remove();questionHeightCache.set(key,height);
  }
  card.style.minHeight=height+'px';
}
function render(focus=true,append=false){
  cancelAnimationFrame(renderFrame);renderFrame=0;resultObserver?.disconnect();
  document.body.classList.toggle('show-results',['results','doctor'].includes(state.screen));
  document.querySelector('.nature').classList.toggle('celebrate',state.screen==='results');
  const template=document.createElement('template');template.innerHTML=screenMarkup();
  if(stage.firstElementChild||state.screen!=='welcome')template.content.querySelector('.screen').classList.add('settled');
  if(append)stage.append(template.content);else stage.replaceChildren(template.content);
  syncPhoneDock();updateJourney();
  if(state.screen==='question')stabilizeQuestion();
  if(state.screen==='results')animateResults();
  observeDoctorAnimation();
  if(focus)announceScreen();
}
function animateFlow(element,keyframes,options){
  if(reduce()||document.hidden||typeof element.animate!=='function')return Promise.resolve();
  const animation=element.animate(keyframes,{easing:MOTION.easing,fill:'both',...options});transitionAnimations.add(animation);
  return animation.finished.catch(()=>{});
}
function updateJourney(){
 let position=0;
 if(state.screen==='results')position=totalQuestions;
 else if(state.screen==='question'||state.screen==='breath'){
  position=scales.slice(0,state.scale).reduce((sum,q)=>sum+q.questions.length,0);
  if(state.screen==='question')position+=state.item+(Number.isInteger(state.answers[scales[state.scale].id][state.item])?1:0);
 }
 const progress=Math.min(1,Math.max(0,position/totalQuestions));
 root.style.setProperty('--journey-scale',String(1+progress*.065));
 root.style.setProperty('--journey-shift',(-progress*2.6)+'%');
 root.style.setProperty('--journey-light',String(.24+progress*.12));
}
function revealQuestionTop(card){
 const top=card.getBoundingClientRect().top;
 if(top < -56&&!reduce())window.scrollTo({top:Math.max(0,window.scrollY+top-22),behavior:'smooth'});
}
async function morphQuestion(card,direction){
 const outgoing=card.querySelector('.question-content');
 const template=document.createElement('template');template.innerHTML=question();
 const incoming=template.content.querySelector('.question-content');
 incoming.querySelectorAll('.answer').forEach(answer=>answer.classList.add('settled'));
 outgoing.inert=true;outgoing.setAttribute('aria-hidden','true');incoming.inert=true;
 card.classList.remove('has-answer','shake');card.classList.add('question-morph');card.append(incoming);
 if(Number.isInteger(state.answers[scales[state.scale].id][state.item]))card.classList.add('has-answer');
 updateJourney();revealQuestionTop(card);
 try{
  const entrance=[{opacity:0},{opacity:1}];
  await Promise.all([
   animateFlow(outgoing,[{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(0,${-direction*6}px,0)`}],{duration:MOTION.out,easing:'cubic-bezier(.4,0,.6,1)'}),
   animateFlow(incoming,entrance,{duration:MOTION.in,delay:MOTION.overlap}),
   animateFlow(incoming.querySelector('h2'),[{transform:`translate3d(0,${direction*7}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap}),
   ...[...incoming.querySelectorAll('.answer')].map((answer,i)=>animateFlow(answer,[{opacity:0,transform:`translate3d(0,${direction*8}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.answer,delay:MOTION.overlap+130+i*MOTION.stagger}))
  ]);
 }finally{outgoing.remove();incoming.inert=false;card.classList.remove('question-morph');announceScreen()}
}
async function navigate(change,direction=1){
  if(state.busy)return;state.busy=true;syncPhoneDock();stage.setAttribute('aria-busy','true');stage.classList.add('flow-transition');
  const previousScreen=state.screen,outgoing=stage.lastElementChild,card=outgoing?.querySelector('.question');
  try{
    // Быстрый «Далее» не обрывает заливку, галочку и мягкую реакцию выбора.
    if(direction>0&&!reduce()&&!document.hidden){
      const now=performance.now(),answerHold=previousScreen==='question'?MOTION.feedbackHold-(now-lastSelectionAt):0;
      const remaining=Math.max(answerHold,MOTION.pressHold-(now-lastActionGlowAt));
      if(remaining>0)await delay(remaining);
    }
    change();syncPhoneDock();
    if(reduce()||document.hidden){render();if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'instant'});return}
    if(previousScreen==='question'&&state.screen==='question'&&card){await morphQuestion(card,direction);return}
    render(false,true);const incoming=stage.lastElementChild;
    if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'smooth'});
    if(outgoing){outgoing.inert=true;outgoing.setAttribute('aria-hidden','true')}
    incoming.inert=true;
    try{
      await Promise.all([
        outgoing?animateFlow(outgoing,[{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(0,${-direction*7}px,0)`}],{duration:MOTION.out}):Promise.resolve(),
        animateFlow(incoming,[{opacity:0,transform:`translate3d(0,${direction*9}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap})
      ]);
    }finally{outgoing?.remove();incoming.inert=false;announceScreen()}
    if(window.scrollY>stage.offsetTop+180)stage.scrollIntoView({block:'start',behavior:'smooth'});
  }finally{transitionAnimations.forEach(animation=>animation.cancel());transitionAnimations.clear();stage.classList.remove('flow-transition');stage.removeAttribute('aria-busy');state.busy=false;syncPhoneDock()}
}
function next(){
  const q=scales[state.scale];
  if(!Number.isInteger(state.answers[q.id][state.item])){
    const card=stage.querySelector('.question');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');document.getElementById('answer-hint').textContent='Выберите, пожалуйста, один вариант ответа.';return;
  }
  illuminateAdvance(phoneLayout.matches?document.querySelector('#phone-dock [data-action="next"]'):stage.querySelector('[data-action="next"]'));
  navigate(()=>{if(state.item<q.questions.length-1)state.item++;else if(state.scale<scales.length-1){state.scale++;state.item=0;state.screen='breath'}else{state.screen='results';state.completedAt=new Date()}});
}
function back(){
  navigate(()=>{
    if(state.screen==='question'){if(state.item>0)state.item--;else state.screen='breath'}
    else if(state.screen==='breath'){if(state.scale>0){state.scale--;state.item=scales[state.scale].questions.length-1;state.screen='question'}else state.screen='profile'}
  },-1);
}
function choose(index,element){
  if(state.busy||state.screen!=='question')return;
  const q=scales[state.scale];if(!q.questions[state.item].options[index])return;
  state.answers[q.id][state.item]=index;lastSelectionAt=performance.now();
  stage.querySelectorAll('[data-answer]').forEach(button=>{const checked=Number(button.dataset.answer)===index;button.setAttribute('aria-checked',String(checked));button.tabIndex=checked?0:-1;});
  const card=stage.querySelector('.question');card.classList.remove('shake','has-answer');void card.offsetWidth;card.classList.add('has-answer');document.getElementById('answer-hint').textContent='';updateProgress();syncPhoneDock();updateJourney();
  if(element&&!reduce()) petals(element);
}
function updateProgress(){const count=answeredCount(), percent=count/totalQuestions*100,progressNode=stage.querySelector('.progress');if(!progressNode)return;progressNode.setAttribute('aria-valuenow',count);progressNode.setAttribute('aria-valuetext',`Заполнено ${count} из ${totalQuestions}`);progressNode.querySelector('.progress-label span:last-child').textContent=`${count} / ${totalQuestions}`;progressNode.querySelector('.vine-line').style.strokeDashoffset=100-percent;progressNode.querySelectorAll('.vine-leaf').forEach((leaf,i)=>leaf.classList.toggle('open',percent>=(i+1)*17));progressNode.querySelector('.vine-flower').classList.toggle('open',count===totalQuestions);}
// ==================== ЭКСПОРТ И УТИЛИТЫ ====================
function reportDate(){return (state.completedAt||new Date()).toLocaleString('ru-RU',{dateStyle:'long',timeStyle:'short',timeZone:'Europe/Moscow'})+' МСК'}
function reportText(){return ['ГОЛОСА ПАЛАТЫ · Результаты скрининговых опросников','Telegram: https://t.me/MUESLIMEDICA',reportDate(),profileSummary(),QUESTIONNAIRES.asrs5.scoringNote,QUESTIONNAIRES.hcl8.scoringNote,isDemo()?'ПРЕДПРОСМОТР. Неподтверждённые бланки не используются для расчёта.':'',...results().map(r=>`${r.scale}${r.scale==='HADS'?' · '+r.title:''}: ${r.available?formatScore(r.total)+' / '+formatScore(r.max)+' баллов':'не рассчитано'}. ${r.message}.`),'','СВОДКА ДЛЯ ВРАЧА-ПСИХИАТРА',buildClinicianSummary(results(),state.profile),'','Результаты не являются диагнозом. Диагноз устанавливает врач при клиническом интервью. Результат ниже порога не исключает расстройства. BIS-brief не имеет единого диагностического порога.'].filter((line,i)=>line||i>1).join('\n')}
function emailHref(){return `mailto:${DOCTOR_EMAIL}?subject=${encodeURIComponent('Результаты опросников перед приёмом')}&body=${encodeURIComponent(reportText())}`}
function toast(message){clearTimeout(toastTimer);const node=document.getElementById('toast');node.textContent=message;node.classList.add('visible');toastTimer=setTimeout(()=>node.classList.remove('visible'),3500)}
async function copyResults(text=reportText()){
  let copied=false;const previous=document.activeElement;
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);copied=true}}catch{}
  if(!copied){const area=document.createElement('textarea');area.value=text;area.setAttribute('aria-label','Текст результатов');area.style.cssText='position:fixed;left:0;top:0;opacity:0;pointer-events:none';document.body.append(area);area.focus();area.select();area.setSelectionRange(0,area.value.length);try{copied=document.execCommand('copy')}catch{}area.remove();previous?.focus({preventScroll:true});}
  if(copied)toast('Скопировано');else{const panel=document.getElementById('copy-panel'),area=document.getElementById('manual-copy');panel.hidden=false;area.value=text;area.focus();area.select();toast('Выделите и скопируйте текст вручную');}
}
function reset(){state.resume=null;scales.forEach(q=>state.answers[q.id].fill(null));state.scale=0;state.item=0;state.screen='welcome';state.profile={sex:'',age:''};state.completedAt=null;}
// ==================== АНИМАЦИИ ====================
function animateResults(){
  const data=results(),pending=new Set();
  function run(card){const index=Number(card.dataset.result),r=data[index];if(!r.available)return;const fraction=Math.max(0,Math.min(1,r.total/r.max));card.querySelector('.ring-value').style.transitionDelay=`${index*120}ms`;card.querySelector('.bar-fill').style.transitionDelay=`${index*120}ms`;card.querySelector('.ring-value').style.strokeDashoffset=100-fraction*100;card.querySelector('.bar-fill').style.transform=`scaleX(${fraction})`;if(reduce()){card.querySelector('.counter').textContent=formatScore(r.total);return}const start=performance.now()+index*120;pending.add({card,r,start});if(!renderFrame)renderFrame=requestAnimationFrame(tick);}
  function tick(now){renderFrame=0;for(const item of pending){if(!item.card.isConnected){pending.delete(item);continue}const t=Math.max(0,Math.min(1,(now-item.start)/1200)),eased=1-Math.pow(1-t,3);item.card.querySelector('.counter').textContent=formatScore(item.r.total*eased,item.r.decimals);if(t===1)pending.delete(item)}if(pending.size)renderFrame=requestAnimationFrame(tick);}
  if('IntersectionObserver' in window){resultObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){run(entry.target);resultObserver.unobserve(entry.target)}}),{threshold:.2});stage.querySelectorAll('.result-card').forEach(card=>resultObserver.observe(card));}
  else stage.querySelectorAll('.result-card').forEach(run);
}
function finishResultAnimations(){if(state.screen!=='results')return;cancelAnimationFrame(renderFrame);renderFrame=0;results().forEach((r,i)=>{const card=stage.querySelector(`[data-result="${i}"]`);if(!r.available||!card)return;card.querySelector('.counter').textContent=formatScore(r.total);card.querySelector('.ring-value').style.strokeDashoffset=100-r.total/r.max*100;card.querySelector('.bar-fill').style.transform=`scaleX(${r.total/r.max})`;});resultObserver?.disconnect();}
const selectionAnimations=new Set();
let selectionSequence=0,selectionTimer;
const selectionLeaf='<svg viewBox="0 0 24 34" aria-hidden="true"><path d="M12 32C2 26-1 12 19 1c6 14 4 25-7 31Z" fill="currentColor"/><path d="M10 33Q11 17 18 5M12 25 6 18m8-1 6-5" fill="none" stroke="#EFF6D9" stroke-opacity=".65" stroke-width=".8"/></svg>';
function clearSelectionEffects(){
 clearTimeout(selectionTimer);selectionAnimations.forEach(animation=>animation.cancel());selectionAnimations.clear();
 document.getElementById('selection-effects')?.replaceChildren();
}
function petals(button){
 if(reduce()||document.hidden)return;clearSelectionEffects();
 const host=document.getElementById('selection-effects'),rect=button.getBoundingClientRect();
 const plan=selectionPlan(scales[state.scale].id,state.item,selectionSequence++);
 if(!host||rect.bottom<0||rect.top>innerHeight)return;
 for(let i=0;i<plan.count;i++){
  const node=document.createElement('span');node.className='selection-particle effect-'+plan.mode;
  const water=plan.mode==='water';
  const x=water?rect.right-38:rect.left+rect.width*(.25+i*.12);
  const y=water?rect.top+rect.height/2:rect.top+rect.height*.55;
  node.style.left=Math.max(20,Math.min(innerWidth-20,x))+'px';
  node.style.top=Math.max(12,Math.min(innerHeight-20,y))+'px';
  node.style.color=['#548B60','#8CAB78','#3B7758','#779F69','#A0B77E'][(i+plan.variant)%5];
  if(!water)node.innerHTML=selectionLeaf;
  host.append(node);
  if(typeof node.animate==='function'){
   const animation=node.animate(selectionKeyframes(plan.mode,i,plan.variant),{duration:plan.duration,delay:i*32,easing:'cubic-bezier(.25,.8,.3,1)',fill:'both'});
   selectionAnimations.add(animation);
   animation.finished.catch(()=>{}).finally(()=>{selectionAnimations.delete(animation);node.remove()});
  }else node.remove();
 }
 selectionTimer=setTimeout(clearSelectionEffects,plan.duration+200);
}
function ripple(event){if(reduce())return;const button=event.target.closest('.button,.answer,.motion');if(!button)return;const box=button.getBoundingClientRect(),node=document.createElement('span');node.className='ripple';node.setAttribute('aria-hidden','true');node.style.setProperty('--diameter',Math.max(box.width,box.height)*2+'px');node.style.setProperty('--rx',(event.detail?event.clientX-box.left:box.width/2)+'px');node.style.setProperty('--ry',(event.detail?event.clientY-box.top:box.height/2)+'px');button.append(node);setTimeout(()=>node.remove(),750);}
const pollen=document.getElementById('pollen');for(let i=0;i<16;i++){const p=document.createElement('i');p.className='particle';p.style.cssText=`--x:${(i*6.7+3)%100}%;--size:${2+i%3}px;--duration:${22+i%5*3}s;--delay:${-i*3.2}s`;pollen.append(p)}
let px=0,py=0,tx=0,ty=0,parallaxFrame=0;
const layers=[...document.querySelectorAll('[data-depth]')];
function parallaxTick(){parallaxFrame=0;if(reduce()||document.hidden)return;px+=(tx-px)*.055;py+=(ty-py)*.055;layers.forEach(layer=>{const d=Number(layer.dataset.depth);layer.style.transform=`translate3d(${px*d}px,${py*d}px,0)`});if(Math.abs(tx-px)+Math.abs(ty-py)>.002)parallaxFrame=requestAnimationFrame(parallaxTick);}
function parallax(){if(!parallaxFrame&&!reduce()&&!document.hidden)parallaxFrame=requestAnimationFrame(parallaxTick)}
window.addEventListener('pointermove',event=>{if(!pointerFine.matches||reduce())return;tx=(event.clientX/innerWidth-.5)*.7;ty=(event.clientY/innerHeight-.5)*.7;parallax();const main=event.target.closest('.magnetic');if(main){const box=main.getBoundingClientRect();main.style.transform=`translate(${(event.clientX-box.left-box.width/2)*.07}px,${(event.clientY-box.top-box.height/2)*.1}px)`;}},{passive:true});
document.addEventListener('pointerout',event=>{const button=event.target.closest('.magnetic');if(button&&!button.contains(event.relatedTarget))button.style.transform='';},{passive:true});
window.addEventListener('scroll',()=>{if(pointerFine.matches||reduce())return;tx=0;ty=Math.min(.45,scrollY/1800);parallax();},{passive:true});
function applyMotion(){controlDoctorAnimation();root.classList.toggle('calm',calm);const effective=reduce(),button=document.getElementById('motion');button.setAttribute('aria-pressed',String(effective));button.setAttribute('aria-label',effective?'Движение уменьшено':'Уменьшить движение');button.title=effective?'Движение уменьшено':'Уменьшить движение';if(effective){clearSelectionEffects();transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;px=py=tx=ty=0;layers.forEach(layer=>layer.style.transform='');document.querySelector('.magnetic')?.style.removeProperty('transform');finishResultAnimations();}}
systemMotion.addEventListener('change',applyMotion);
document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden);controlDoctorAnimation();if(document.hidden){clearSelectionEffects();transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;finishResultAnimations()}else parallax();});
window.addEventListener('beforeprint',()=>{clearSelectionEffects();finishResultAnimations()});
// ==================== СОБЫТИЯ И ДОСТУПНОСТЬ ====================
document.addEventListener('click',event=>{
  if(event.target.closest('a[data-action]'))event.preventDefault();
  if(event.target.closest('#motion')){calm=!calm;applyMotion();toast(systemMotion.matches?'В системе включено уменьшение движения':calm?'Спокойный режим включён':'Анимации включены');return;}
  if(state.busy)return;ripple(event);
  const answer=event.target.closest('[data-answer]');if(answer){choose(Number(answer.dataset.answer),answer);return;}
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='start')beginOrResume();
  if(action==='home')goHome();
  if(action==='doctor'&&state.completedAt)navigate(()=>{state.screen='doctor'});
  if(action==='results'&&state.completedAt)navigate(()=>{state.screen='results'},-1);
  if(action==='copy-doctor')copyResults(doctorReportText());
  if(action==='profile-back')navigate(()=>{state.screen='welcome'},-1);
  if(action==='continue'){if(Object.keys(validateProfile(state.profile)).length){navigate(()=>{state.screen='profile'});return}illuminateAdvance(event.target.closest('[data-action="continue"]'));navigate(()=>{state.screen='question';state.item=0})}
  if(action==='next')next();if(action==='back')back();if(action==='copy')copyResults();
  if(action==='print'){finishResultAnimations();window.print();}
  if(action==='restart'){document.getElementById('restart-confirm').hidden=false;stage.querySelector('[data-action="cancel-restart"]').focus();}
  if(action==='cancel-restart'){document.getElementById('restart-confirm').hidden=true;stage.querySelector('[data-action="restart"]').focus();}
  if(action==='confirm-restart')navigate(reset,-1);
});
stage.addEventListener('submit',event=>{if(event.target.id==='profile-form')submitProfile(event)});
stage.addEventListener('input',event=>{
  if(state.screen!=='profile')return;
  if(event.target.name==='age')state.profile.age=event.target.value;
  if(event.target.name==='sex')state.profile.sex=event.target.value;
});
stage.addEventListener('keydown',event=>{
  if(state.screen!=='question'||state.busy||event.altKey||event.ctrlKey||event.metaKey)return;
  const options=[...stage.querySelectorAll('[data-answer]')],focused=event.target.closest('[data-answer]'),q=scales[state.scale];
  if(/^[1-5]$/.test(event.key)){const index=Number(event.key)-1;if(options[index]){event.preventDefault();choose(index,options[index]);options[index].focus();}return;}
  if(focused&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)){
    event.preventDefault();let i=Number(focused.dataset.answer);i=event.key==='Home'?0:event.key==='End'?options.length-1:(i+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+options.length)%options.length;choose(i,options[i]);options[i].focus();
  }
  // Enter на варианте выбирает его (нативный click); повторный Enter идёт далее.
  if(event.key==='Enter'&&focused&&state.answers[q.id][state.item]===Number(focused.dataset.answer)){event.preventDefault();next();}
  else if(event.key==='Enter'&&event.target.id==='screen-title'){event.preventDefault();next();}
});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.screen==='question'&&!state.busy)stabilizeQuestion()},180)},{passive:true});
document.fonts?.addEventListener('loadingdone',()=>{questionHeightCache.clear();if(state.screen==='question'&&!state.busy)stabilizeQuestion()});
applyMotion();render(false);
})();
</script>
