/* Пол и возраст: обязательный шаг перед взрослыми опросниками. */
.profile-card{max-width:720px;margin:auto;padding:clamp(24px,5vw,48px)}
.profile-description{font-size:14px;color:var(--muted);margin:16px 0 26px;max-width:490px}
.profile-sex{border:0;margin:0;padding:0;min-width:0}
.profile-sex legend,.age-label{font-size:13px;font-weight:600;margin-bottom:12px;display:block}
.profile-sex-options{display:flex;flex-wrap:wrap;gap:10px}
.profile-choice{position:relative;cursor:pointer;flex:1;min-width:130px}
.profile-choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.profile-choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:14px;border:1px solid #22553C40;border-radius:16px;background:#fff8;font-size:12px;line-height:1.5;transition:background var(--t-base),border-color var(--t-base)}
.profile-choice input:checked+span{background:linear-gradient(110deg,#CDEBD8,#E8F2CE);border-color:var(--forest)}
.profile-choice input:focus-visible+span{outline:3px solid var(--forest);outline-offset:4px}
.age-input{width:100%;max-width:240px;min-height:54px;border:1px solid #22553C50;border-radius:16px;background:#fff9;color:var(--ink);padding:14px 18px;font:16px 'Onest',Arial,sans-serif}
.age-input:focus-visible{outline:3px solid var(--forest);outline-offset:4px}
.age-input[aria-invalid=true]{border-color:var(--amber)}
.field-error{min-height:20px;color:var(--amber);font-size:12px;line-height:1.6;margin:8px 0 15px}
.profile-rule{font-size:11px;color:var(--muted);background:#ECF5EA;padding:15px;border-radius:14px;line-height:1.8}
.result-heading .profile-summary{font-size:12px;margin-top:12px}
@media(max-width:420px){.profile-choice{min-width:100%;}.age-input{max-width:none}.profile-card{padding:25px 21px}}
@media print{.profile-card{display:none!important}.result-heading .profile-summary{font-size:9pt;margin-top:3mm}}
/* Блики жидкого стекла и спокойная реакция на выбор. */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.52) 55%,rgba(242,250,245,.72));-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border-color:rgba(255,255,255,.92);box-shadow:0 25px 70px #154A2E0D,0 5px 18px #154A2E09,inset 0 1px 0 #fff,inset 0 -1px 0 #ffffff80}

@keyframes choice-echo{0%{opacity:0;transform:translateY(8px) scale(.6) rotate(-12deg)}25%{opacity:.9;transform:translateY(-4px) scale(1.12) rotate(4deg)}100%{opacity:0;transform:translateY(-34px) scale(.8) rotate(12deg)}}
.doctor-summary{margin-top:22px;padding:24px;border-radius:20px}
.doctor-summary h3{font-size:14px;margin-bottom:14px}
.doctor-summary-text{white-space:pre-line;font-size:12px;line-height:1.8;color:var(--muted)}

@media(prefers-reduced-motion:reduce){.choice-echo{display:none}}
@media print{.doctor-summary{padding:3mm;margin-top:4mm;break-inside:avoid}.doctor-summary h3{font-size:9pt;margin-bottom:2mm}.doctor-summary-text{font-size:7.5pt;line-height:1.4}.doctor-summary-text{white-space:pre-line}.result-card{padding:3mm}.result-note{margin-top:3mm;font-size:7pt}.choice-echo{display:none}}

/* Onest: единая типографика и понятная навигация перед приёмом. */
:root{--font-sans:'Onest',Arial,sans-serif}
html,h1,h2,.brand,.frankl-quote blockquote p{font-family:var(--font-sans)}
h1{font-size:clamp(42px,6.3vw,80px);font-weight:500;letter-spacing:-.055em;line-height:1.06}
h2{font-weight:500;letter-spacing:-.04em}.brand{font-weight:600;letter-spacing:-.9px}
.welcome h1 .word{max-width:100%}.welcome h1 em{font-style:normal;font-weight:500}
.frankl-quote blockquote p{font-weight:400;letter-spacing:-.025em}
.footer{align-items:flex-end}.footer-channel{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}.footer-brand{font-size:12px;font-weight:500;letter-spacing:.015em;color:var(--muted)}
.telegram-link{display:inline-flex;align-items:center;gap:10px;min-height:54px;max-width:100%;padding:10px 13px;border:1px solid #1F6B4A22;border-radius:18px;background:#FFFFFF70;text-decoration:none;color:var(--emerald)}
.telegram-link:hover{background:#FFFFFFA8;border-color:#1F6B4A48}.telegram-icon{width:32px;height:32px;flex:none}.telegram-link .telegram-copy{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-width:0}.telegram-copy strong{font-size:13px;line-height:1.3;font-weight:600}.telegram-copy small{font-size:11px;line-height:1.4;letter-spacing:.015em;color:var(--muted)}.telegram-arrow{width:17px;height:17px;margin-left:6px;flex:none;opacity:.7}.footer-privacy{font-size:10px;line-height:1.7}

/* «Первый шаг»: ботаническая ниша и живая, но спокойная айдентика. */
.brand{gap:12px;flex:none;align-items:center;letter-spacing:-.045em}
.brand-badge{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#FFFFFFB8,#E8F3E37A);border:1px solid #FFFFFFDB;box-shadow:inset 0 1px 0 #fff,0 5px 16px #214A3210;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand .brand-sprout{width:27px;height:30px;overflow:visible}.brand-stem{fill:none;stroke:#1F5A43;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:31;stroke-dashoffset:0;animation:brand-draw .8s var(--ease-out) both}
.brand-sprout-leaf{fill:#4E8F6B;transform-box:fill-box;transform-origin:100% 100%;animation:brand-unfold .75s .55s var(--ease-out) both}.brand-sprout-leaf.right{fill:#1F5A43;transform-origin:0 100%;animation-delay:.7s}
.brand-label{max-width:none;white-space:nowrap;line-height:1.25;overflow:visible}.brand-letter{position:relative;display:inline-block}.brand .brand-letter-leaf{position:absolute;width:.57em;height:.45em;left:.22em;top:-.18em;overflow:visible;transform:rotate(-8deg);animation:brand-mark .8s .9s var(--ease-out) both}
@keyframes brand-draw{from{stroke-dashoffset:31}to{stroke-dashoffset:0}}@keyframes brand-unfold{from{opacity:0;transform:scale(.1) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes brand-mark{from{opacity:0;transform:translateY(3px) rotate(-20deg) scale(.4)}to{opacity:1;transform:translateY(0) rotate(-8deg) scale(1)}}
.welcome{grid-template-columns:minmax(0,1.13fr) minmax(0,.87fr);gap:40px}.welcome-copy{min-width:0}.welcome .meta{margin-bottom:28px}.welcome .private{max-width:340px;font-size:11px;line-height:1.65}
.hero-garden{isolation:isolate;width:100%;aspect-ratio:.81;max-height:550px;opacity:1;overflow:visible;margin:0;position:relative;right:auto;top:auto}
.hero-garden:before{display:none}.plant-niche{position:absolute;inset:12px 16px;border-radius:50% 50% 30px 30px / 43% 43% 30px 30px;background:linear-gradient(155deg,#DCEBDD 8%,#BFD8C4 100%);border:1px solid #EDF7EBD9;box-shadow:inset 0 1px 1px #fff9,inset 0 -30px 80px #63856B16,0 25px 65px #234E3010;overflow:hidden;isolation:isolate}
.plant-niche:after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,#FFFCE44D,transparent 45%,#4474520C);pointer-events:none}
.niche-light{position:absolute;width:90%;height:50%;left:-35%;top:6%;border-radius:48%;background:radial-gradient(ellipse,#FFFCE4A3,transparent 65%);filter:blur(13px);transform:rotate(-28deg);animation:niche-light-drift 20s ease-in-out infinite alternate;pointer-events:none}
.niche-light-second{left:36%;top:48%;width:75%;height:35%;opacity:.55;animation-duration:26s;animation-delay:-9s}
@keyframes niche-light-drift{from{transform:translate3d(-6%,-5%,0) rotate(-28deg);opacity:.45}to{transform:translate3d(23%,17%,0) rotate(-13deg);opacity:.85}}
.art>.hero-plant{position:relative;width:88%;height:94%;overflow:visible;filter:drop-shadow(3px 8px 6px #173D2B10);animation:hero-garden-in 1.4s var(--ease-out) both;transform-origin:50% 92%}
@keyframes hero-garden-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.hero-leaf{transform-box:view-box;animation:hero-leaf-sway 7s ease-in-out infinite alternate}.leaf-one{transform-origin:187px 264px;animation-delay:-2s}.leaf-two{transform-origin:132px 305px;animation-duration:8s;animation-delay:-4s}.leaf-three{transform-origin:263px 289px;animation-duration:6.8s;animation-delay:-1s}.leaf-four{transform-origin:133px 369px;animation-duration:7.6s;animation-delay:-5s}.leaf-five{transform-origin:266px 359px;animation-duration:6.4s;animation-delay:-3s}
@keyframes hero-leaf-sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.garden-chips{position:absolute;inset:0;z-index:2;list-style:none;padding:0;margin:0;pointer-events:none}.garden-chip{position:absolute;display:flex;align-items:center;gap:8px;padding:12px 15px;min-height:43px;white-space:nowrap;border-radius:16px;background:linear-gradient(135deg,#FFFFFFC4,#FFFFFF8A);border:1px solid #FFFFFFE6;-webkit-backdrop-filter:blur(15px) saturate(125%);backdrop-filter:blur(15px) saturate(125%);box-shadow:0 12px 30px #1F5A4310,inset 0 1px 0 #FFFFFFB3;color:#1F5A43;font-size:12px;font-weight:500;line-height:1.4;animation:fade-up 1s var(--ease-out) both;animation-delay:1s}.garden-chip svg{width:17px;height:17px;flex:none}.chip-private{left:-4px;top:27%}.chip-time{right:-5px;top:58%;animation-delay:1.15s}.chip-open{left:6%;bottom:9%;animation-delay:1.3s}.chip-dot{width:6px;height:6px;border-radius:50%;background:#4E8F6B;box-shadow:0 0 0 4px #4E8F6B12}
.paused .hero-leaf,.paused .niche-light,.paused .brand *{animation-play-state:paused!important}

t:500}.completion-editorial[data-state="ready"] .completion-fallback{display:none}.completion-editorial:not([data-state="ready"]) .completion-replay{visibility:hidden}.completion-editorial[data-state="fallback"] canvas{display:none}.doctor-heading{grid-template-columns:minmax(0,1fr)}

    return [{opacity:0,transform:'translate3d(0,0,0) scale(.3)'},{offset:.24,opacity:.34,transform:'translate3d(0,0,0) scale(.9)'},{offset:.7,opacity:.16,transform:`translate3d(0,${index}px,0) scale(${1.6+index*.12})`},{opacity:0,transform:`translate3d(0,${index*2}px,0) scale(${2.3+index*.15})`}];
  }
  const tilt=-22+index*11;
  return [
    {opacity:0,transform:`translate3d(0,0,0) rotate(${tilt}deg) scale(.45)`},
    {offset:.16,opacity:.64,transform:`translate3d(${middle[0]*.22}px,${middle[1]*.18}px,0) rotate(${tilt+rotation*.12}deg) scale(.92)`},
    {offset:.48,opacity:.59,transform:`translate3d(${middle[0]}px,${middle[1]}px,0) rotate(${rotation*.45}deg) scale(1)`},
    {offset:.76,opacity:.3,transform:`translate3d(${middle[0]+(end[0]-middle[0])*.68}px,${middle[1]+(end[1]-middle[1])*.58}px,0) rotate(${rotation*.8}deg) scale(.93)`},
    {opacity:0,transform:`translate3d(${end[0]}px,${end[1]}px,0) rotate(${rotation}deg) scale(.74)`}
  ];
}

// Сводка для врача описывает только результаты самоотчёта, без нового диагноза.
function buildClinicianSummary(rows,profile){
  const number=value=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value);
  const sex={male:'мужской',female:'женский',unspecified:'не указан'}[profile.sex]||'не указан';
  const lines=[`Скрининговое обследование по данным самоотчёта. Возраст: ${profile.age||'не указан'}; пол: ${sex}.`];
  const hads=rows.filter(r=>r.scale==='HADS');
  if(hads.length===2&&hads.every(r=>r.available)){
    const grade=value=>value<8?'ниже скринингового порога':value<11?'субклиническая выраженность симптомов по шкале':'клиническая выраженность симптомов по шкале';
    lines.push(`HADS-A: ${number(hads[0].total)}/21, ${grade(hads[0].total)}. HADS-D: ${number(hads[1].total)}/21, ${grade(hads[1].total)}.`);
  }
  for(const row of rows){
    if(row.scale==='HADS')continue;
    if(!row.available){lines.push(`${row.scale}: результат недоступен; ${row.message}.`);continue}
    const value=`${number(row.total)}/${number(row.max)}`;
    if(row.scale==='AQ-10')lines.push(`AQ-10: ${value}; скрининговый порог ${row.high?'достигнут':'не достигнут'}.`);
    if(row.scale==='ASRS-5')lines.push(`ASRS-5: ${value}, простая сумма ответов. Пороговая интерпретация не проводилась: взвешенный ключ в этой версии не используется.`);
    if(row.scale==='BIS-brief')lines.push(`BIS-brief: ${value}; сумма баллов, без диагностической категоризации.`);
    if(row.scale==='HCL-8')lines.push(`HCL-8: ${value}, взвешенная русская версия; порог 9,3 ${row.high?'достигнут':'не достигнут'}.`);
  }
  const directions=[];
  if(hads.some(r=>r.available&&r.high))directions.push('выраженность и длительность тревожных и депрессивных симптомов');
  if(rows.some(r=>r.scale==='AQ-10'&&r.available&&r.high))directions.push('анамнез развития и особенности социальной коммуникации');
  if(rows.some(r=>r.scale==='HCL-8'&&r.available&&r.high))directions.push('наличие, продолжительность и последствия периодов подъёма настроения и активности');
  if(directions.length)lines.push(`При клиническом интервью целесообразно уточнить: ${directions.join('; ')}.`);
  lines.push('Результаты скрининга не являются диагнозом и не позволяют установить или исключить расстройство без клинической оценки.');
  return lines.join('\n\n');
}

// Возраст проверяет применимость набора 18+; пол включается в отчёт врачу.
function validateProfile(profile){
  const errors={};
  if(!['male','female','unspecified'].includes(profile.sex))errors.sex='Укажите пол или выберите «Не хочу указывать».';
  const raw=String(profile.age??'').trim(),age=Number(raw);
  if(!/^\d{1,3}$/.test(raw)||!Number.isInteger(age)||age<1||age>120)errors.age='Введите возраст целым числом от 1 до 120 лет.';
  else if(age<18)errors.age='Этот набор опросников предназначен для взрослых от 18 лет. Для вашего возраста нужен другой набор.';
  return errors;
}

const sexLabels={male:'Мужской',female:'Женский',unspecified:'Не указан'};
function adaptWording(text,sex){
  if(!['male','female'].includes(sex))return text;
  const index=sex==='female'?1:0;
  const forms=[
    ['Я стал (стала) менее застенчивым (застенчивой) и «закомплексованным» («закомплексованной»).','Я стал менее застенчивым и «закомплексованным».','Я стала менее застенчивой и «закомплексованной».'],
    ['отвлекался (отвлекалась)','отвлекался','отвлекалась'],
    ['напуган(а)','напуган','напугана'],['способен(на)','способен','способна'],
    ['жизнерадостный(ная)','жизнерадостный','жизнерадостная'],
    ['замедленным(ой)','замедленным','замедленной'],['стал(а)','стал','стала'],
    ['согласен(на)','согласен','согласна'],['невнимательный(-ая)','невнимательный','невнимательная'],
    ['аккуратен(-на)','аккуратен','аккуратна'],['осторожен(-на)','осторожен','осторожна'],
    ['говорил(а)','говорил','говорила'],['шутил(а)','шутил','шутила'],['каламбурил(а)','каламбурил','каламбурила'],
    ['раздражал(а)','раздражал','раздражала'],['утомлял(а)','утомлял','утомляла'],
    ['энергичным(ой)','энергичным','энергичной'],['активным(ой)','активным','активной'],['приподнятым(ой)','приподнятым','приподнятой']
  ];
  return forms.reduce((value,[original,male,female])=>value.split(original).join(index?female:male),text);
}
const wording=text=>adaptWording(text,state.profile.sex);

function submitProfile(event){
  event.preventDefault();if(state.busy)return;
  const form=event.target;
  state.profile.sex=form.querySelector('input[name="sex"]:checked')?.value||'';
  state.profile.age=form.querySelector('[name="age"]').value.trim();
  const errors=validateProfile(state.profile);
  document.getElementById('sex-error').textContent=errors.sex||'';
  document.getElementById('age-error').textContent=errors.age||'';
  const fieldset=form.querySelector('fieldset'),age=form.querySelector('[name="age"]');
  fieldset.setAttribute('aria-invalid',String(!!errors.sex));
  form.querySelectorAll('input[name="sex"]').forEach(input=>input.setAttribute('aria-invalid',String(!!errors.sex)));
  age.setAttribute('aria-invalid',String(!!errors.age));
  if(errors.sex){form.querySelector('input[name="sex"]').focus();return}
  if(errors.age){age.focus();return}
  state.profile.age=String(Number(state.profile.age));age.blur();
  navigate(()=>{state.screen='breath';state.scale=0;state.item=0});
}

">ASRS-5: простая сумма 0–24 без пороговой интерпретации. HCL-8: взвешенная сумма 0–22,05, порог 9,3.</p><div class="result-actions"><button class="button primary" data-action="copy">Скопировать результат ${arrow}</button><button class="button secondary" data-action="print">Скачать PDF</button><a class="button secondary" id="email-link" href="${esc(emailHref())}" style="text-decoration:none">Отправить на почту</a></div><div class="copy-panel glass" id="copy-panel" hidden><label for="manual-copy">Автоматическое копирование недоступно. Выделите текст и скопируйте вручную.</label><textarea id="manual-copy" readonly></textarea></div><p class="result-note">Результаты опросников не являются диагнозом. Баллы отражают ответы в рамках конкретной шкалы. Повышенный результат — повод обсудить состояние с врачом; результат ниже порога не исключает трудностей. BIS-brief показывает только сумму, без оценки «норма / повышенный риск».</p><p class="result-note" style="margin-top:10px">«Скачать PDF» открывает окно печати: выберите «Сохранить как PDF». Почта откроется в вашем почтовом приложении; отправку нужно подтвердить в нём.</p><div class="restart"><button class="text-button" data-action="home"><span>На главную</span></button><br><button class="text-button" data-action="restart"><span>Пройти заново</span></button><div class="restart-confirm glass" id="restart-confirm" hidden>Начать заново? Текущие ответы будут удалены.<div><button class="button secondary" data-action="cancel-restart">Остаться</button><button class="button primary" data-action="confirm-restart">Начать заново</button></div></div></div></section>`}

function stabilizeQuestion(){
  const card=stage.lastElementChild?.querySelector('.question');if(!card)return;

function animateFlow(element,keyframes,options){
  if(reduce()||document.hidden||typeof element.animate!=='function')return Promise.resolve();

function updateJourney(){
 let position=0;
 if(state.screen==='results')position=totalQuestions;
 else if(state.screen==='question'||state.screen==='breath'){
  position=scales.slice(0,state.scale).reduce((sum,q)=>sum+q.questions.length,0);
  if(state.screen==='question')position+=state.item+(Number.isInteger(state.answers[scales[state.scale].id][state.item])?1:0);
 }
 const progress=Math.min(1,Math.max(0,position/totalQuestions));
 root.style.setProperty('--journey-scale',String(1+progress*.065));

function revealQuestionTop(card){

}
async function morphQuestion(card,direction){

 const template=document.createElement('template');template.innerHTML=question();
 const incoming=template.content.querySelector('.question-content');
 incoming.querySelectorAll('.answer').forEach(answer=>answer.classList.add('settled'));
 outgoing.inert=true;outgoing.setAttribute('aria-hidden','true');incoming.inert=true;
 card.classList.remove('has-answer','shake');card.classList.add('question-morph');card.append(incoming);

 updateJourney();revealQuestionTop(card);
 try{

   animateFlow(incoming,entrance,{duration:MOTION.in,delay:MOTION.overlap}),
   animateFlow(incoming.querySelector('h2'),[{transform:`translate3d(0,${direction*7}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap}),
   ...[...incoming.querySelectorAll('.answer')].map((answer,i)=>animateFlow(answer,[{opacity:0,transform:`translate3d(0,${direction*8}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.answer,delay:MOTION.overlap+130+i*MOTION.stagger}))

async function navigate(change,direction=1){
  if(state.busy)return;state.busy=true;syncPhoneDock();stage.setAttribute('aria-busy','true');stage.classList.add('flow-transition');
  const previousScreen=state.screen,outgoing=stage.lastElementChild,card=outgoing?.querySelector('.question');
  try{
    // Быстрый «Далее» не обрывает заливку, галочку и мягкую реакцию выбора.
    if(direction>0&&!reduce()&&!document.hidden){
      const now=performance.now(),answerHold=previousScreen==='question'?MOTION.feedbackHold-(now-lastSelectionAt):0;
      const remaining=Math.max(answerHold,MOTION.pressHold-(now-lastActionGlowAt));
      if(remaining>0)await delay(remaining);
    }
    change();syncPhoneDock();
    if(reduce()||document.hidden){render();if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'instant'});return}
    if(previousScreen==='question'&&state.screen==='question'&&card){await morphQuestion(card,direction);return}
    render(false,true);const incoming=stage.lastElementChild;
    if(previousScreen!==state.screen)window.scrollTo({top:0,behavior:'smooth'});

      await Promise.all([
        outgoing?animateFlow(outgoing,[{opacity:1,transform:'translate3d(0,0,0)'},{opacity:0,transform:`translate3d(0,${-direction*7}px,0)`}],{duration:MOTION.out}):Promise.resolve(),
        animateFlow(incoming,[{opacity:0,transform:`translate3d(0,${direction*9}px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:MOTION.in,delay:MOTION.overlap})

function next(){
  const q=scales[state.scale];
  if(!Number.isInteger(state.answers[q.id][state.item])){

function animateResults(){

  host.append(node);
  if(typeof node.animate==='function'){
   const animation=node.animate(selectionKeyframes(plan.mode,i,plan.variant),{duration:plan.duration,delay:i*plan.stagger,easing:'cubic-bezier(.37,0,.32,1)',fill:'both'});
   selectionAnimations.add(animation);
   animation.finished.catch(()=>{}).finally(()=>{selectionAnimations.delete(animation);node.remove()});
  }else node.remove();
 }
 selectionTimer=setTimeout(clearSelectionEffects,plan.duration+(plan.count-1)*plan.stagger+120);
}
function ripple(event){if(reduce())return;const button=event.target.closest('.button,.answer,.motion');if(!button)return;const box=button.getBoundingClientRect(),node=document.createElement('span');node.className='ripple';node.setAttribute('aria-hidden','true');node.style.setProperty('--diameter',Math.max(box.width,box.height)*2+'px');node.style.setProperty('--rx',(event.detail?event.clientX-box.left:box.width/2)+'px');node.style.setProperty('--ry',(event.detail?event.clientY-box.top:box.height/2)+'px');button.append(node);setTimeout(()=>node.remove(),750);}
const pollen=document.getElementById('pollen');for(let i=0;i<16;i++){const p=document.createElement('i');p.className='particle';p.style.cssText=`--x:${(i*6.7+3)%100}%;--size:${2+i%3}px;--duration:${22+i%5*3}s;--delay:${-i*3.2}s`;pollen.append(p)}
let px=0,py=0,tx=0,ty=0,parallaxFrame=0;
const layers=[...document.querySelectorAll('[data-depth]')];
function parallaxTick(){parallaxFrame=0;if(reduce()||document.hidden)return;px+=(tx-px)*.055;py+=(ty-py)*.055;layers.forEach(layer=>{const d=Number(layer.dataset.depth);layer.style.transform=`translate3d(${px*d}px,${py*d}px,0)`});if(Math.abs(tx-px)+Math.abs(ty-py)>.002)parallaxFrame=requestAnimationFrame(parallaxTick);}
function parallax(){if(!parallaxFrame&&!reduce()&&!document.hidden)parallaxFrame=requestAnimationFrame(parallaxTick)}
window.addEventListener('pointermove',event=>{if(!pointerFine.matches||reduce())return;tx=(event.clientX/innerWidth-.5)*.7;ty=(event.clientY/innerHeight-.5)*.7;parallax();const main=event.target.closest('.magnetic');if(main){const box=main.getBoundingClientRect();main.style.transform=`translate(${(event.clientX-box.left-box.width/2)*.07}px,${(event.clientY-box.top-box.height/2)*.1}px)`;}},{passive:true});
document.addEventListener('pointerout',event=>{const button=event.target.closest('.magnetic');if(button&&!button.contains(event.relatedTarget))button.style.transform='';},{passive:true});
window.addEventListener('scroll',()=>{if(pointerFine.matches||reduce())return;tx=0;ty=Math.min(.45,scrollY/1800);parallax();},{passive:true});
function applyMotion(){controlCompletionScene();root.classList.toggle('calm',calm);const effective=reduce(),button=document.getElementById('motion');button.setAttribute('aria-pressed',String(effective));button.setAttribute('aria-label',effective?'Движение уменьшено':'Уменьшить движение');button.title=effective?'Движение уменьшено':'Уменьшить движение';if(effective){clearSelectionEffects();transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;px=py=tx=ty=0;layers.forEach(layer=>layer.style.transform='');document.querySelector('.magnetic')?.style.removeProperty('transform');finishResultAnimations();}}
systemMotion.addEventListener('change',applyMotion);
document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden);controlCompletionScene();if(document.hidden){clearSelectionEffects();transitionAnimations.forEach(animation=>{try{animation.finish()}catch{animation.cancel()}});cancelAnimationFrame(parallaxFrame);parallaxFrame=0;finishResultAnimations()}else parallax();});
window.addEventListener('beforeprint',()=>{clearSelectionEffects();finishResultAnimations()});
// ==================== СОБЫТИЯ И ДОСТУПНОСТЬ ====================
document.addEventListener('click',event=>{
  if(event.target.closest('a[data-action]'))event.preventDefault();
  if(event.target.closest('#motion')){calm=!calm;applyMotion();toast(systemMotion.matches?'В системе включено уменьшение движения':calm?'Спокойный режим включён':'Анимации включены');return;}
  if(state.busy)return;ripple(event);
  const answer=event.target.closest('[data-answer]');if(answer){choose(Number(answer.dataset.answer),answer);return;}
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='start')beginOrResume();
  if(action==='home')goHome();
  if(action==='doctor'&&state.completedAt)navigate(()=>{state.screen='doctor'});
  if(action==='results'&&state.completedAt)navigate(()=>{state.screen='results'},-1);
  if(action==='copy-doctor')copyResults(doctorReportText());
  if(action==='profile-back')navigate(()=>{state.screen='welcome'},-1);
  if(action==='continue'){if(Object.keys(validateProfile(state.profile)).length){navigate(()=>{state.screen='profile'});return}illuminateAdvance(event.target.closest('[data-action="continue"]'));navigate(()=>{state.screen='question';state.item=0})}
  if(action==='next')next();if(action==='back')back();if(action==='copy')copyResults();
  if(action==='print'){finishResultAnimations();window.print();}
  if(action==='restart'){document.getElementById('restart-confirm').hidden=false;stage.querySelector('[data-action="cancel-restart"]').focus();}
  if(action==='cancel-restart'){document.getElementById('restart-confirm').hidden=true;stage.querySelector('[data-action="restart"]').focus();}
  if(action==='confirm-restart')navigate(reset,-1);
});
stage.addEventListener('submit',event=>{if(event.target.id==='profile-form')submitProfile(event)});
stage.addEventListener('input',event=>{
  if(state.screen!=='profile')return;
  if(event.target.name==='age')state.profile.age=event.target.value;
  if(event.target.name==='sex')state.profile.sex=event.target.value;
});
stage.addEventListener('keydown',event=>{
  if(state.screen!=='question'||state.busy||event.altKey||event.ctrlKey||event.metaKey)return;
  const options=[...stage.querySelectorAll('[data-answer]')],focused=event.target.closest('[data-answer]'),q=scales[state.scale];
  if(/^[1-5]$/.test(event.key)){const index=Number(event.key)-1;if(options[index]){event.preventDefault();choose(index,options[index]);options[index].focus();}return;}
  if(focused&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)){
    event.preventDefault();let i=Number(focused.dataset.answer);i=event.key==='Home'?0:event.key==='End'?options.length-1:(i+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+options.length)%options.length;choose(i,options[i]);options[i].focus();
  }
  // Enter на варианте выбирает его (нативный click); повторный Enter идёт далее.
  if(event.key==='Enter'&&focused&&state.answers[q.id][state.item]===Number(focused.dataset.answer)){event.preventDefault();next();}
  else if(event.key==='Enter'&&event.target.id==='screen-title'){event.preventDefault();next();}
});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.screen==='question'&&!state.busy)stabilizeQuestion()},180)},{passive:true});
document.fonts?.addEventListener('loadingdone',()=>{questionHeightCache.clear();if(state.screen==='question'&&!state.busy)stabilizeQuestion()});
// Фирменный росток раскрывается один раз, не повторяясь при навигации.
const brandMark=document.querySelector('.brand-letter-leaf');
if(reduce())document.querySelector('.brand').classList.add('brand-established');
else brandMark.addEventListener('animationend',()=>document.querySelector('.brand').classList.add('brand-established'),{once:true});
// Молодой лист раскрывается только при первом посещении главного экрана.
if(reduce())root.classList.add('garden-established');
document.addEventListener('animationend',event=>{if(event.animationName==='young-leaf-unfurl')root.classList.add('garden-established')});
applyMotion();render(false);
})();
</script>
</body>
